# Single source of truth for MTL integration test profiles, topologies, and CI runs.
# Shared by tests/integration_tests/runner/ and the devtools test plan.

topologies:
  vf_pair:
    ports: 2
    kind: vf
    same_pf: true
  vf_quad:
    ports: 4
    kind: vf
    same_pf: true
  cross_pf_quad:
    ports: 4
    kind: vf
    cross_pf: true
    rx_timestamp: true
  pf_pair:
    ports: 2
    kind: pf
    rx_timestamp: true
  kernel_lo:
    ports: 0
    kind: kernel_socket

profiles:
  default: {}
  queue_cnt_24:
    extra_args: [--queue_cnt, "24"]
  dma_va:
    extra_args: [--iova_mode, va]
    iova_mode: va
  auto_pacing_pa:
    extra_args: [--rss_mode, l3_l4, --pacing_way, auto, --iova_mode, pa, --multi_src_port]
    rss_mode: l3_l4
    pacing_way: auto
    iova_mode: pa
  auto_pacing_va:
    extra_args: [--rss_mode, l3_l4, --pacing_way, auto, --iova_mode, va, --multi_src_port]
    rss_mode: l3_l4
    pacing_way: auto
    iova_mode: va
  tsc_pacing:
    extra_args: [--rss_mode, l3_l4, --pacing_way, tsc, --iova_mode, va, --multi_src_port]
    rss_mode: l3_l4
    pacing_way: tsc
    iova_mode: va
  kernel_lo:
    pmd: kernel_socket
  noctx:
    instance: own
    env:
      NOCTX_REQUIRE_STRICT: "1"
      NOCTX_STABILITY_SECONDS: "60"
      NOCTX_TEST_DURATION: "10"
      MTL_ISOLATE: require
  noctx_pf:
    instance: own

runs:
  pr:
    - {name: st2110_20, profile: default, topology: vf_pair, filter: "St20_rx*:St20_tx*-St20_tx.create_queue_cnt", dma_auto: true}
    - {name: st2110_20p, profile: default, topology: vf_pair, filter: "St20p*-St20p.redundant*"}
    - {name: st2110_20_tx_queue_cnt, profile: queue_cnt_24, topology: vf_pair, filter: "St20_tx.create_queue_cnt"}
    - {name: st2110_22, profile: default, topology: vf_pair, filter: "St22*"}
    - {name: st2110_3x_4x, profile: default, topology: vf_pair, filter: "St3*:St4*-St30p.redundant*:St40p.redundant*"}
  nightly:
    - {name: core_misc, profile: default, topology: vf_pair, filter: "Main*:Misc*:Sch*:TxUserTimestampSync*"}
    - {name: redundant_stats, profile: default, topology: vf_quad, filter: "St20p.redundant*:St30p.redundant*:St40p.redundant*"}
    - {name: st20p_kernel_loopback, profile: kernel_lo, topology: kernel_lo, needs_root: false, filter: "St20p.tx_create_free_single:St20p.rx_create_free_single:St20p.digest_1080p_s1:St20p.digest_1080i_s2:St20p.tx_put_frame_abort:St20p.rx_put_frame_abort:St20p.frame_is_late:St20p.query_params:St20p.session_stats_reset:St20p.update_source_and_destination"}
    # Run st20p_tsc_pacing before any RL init (including dma_cvt_va). On DPDK
    # < 26.07.91, the ice PF keeps VF queue rate limits across processes.
    - {name: st20p_tsc_pacing, profile: tsc_pacing, topology: vf_pair, filter: "St20p.digest*:St20p.transport_*:St20p.frame_is_late:St20p.tx_*no_epoch_drop-St20p.*ext*"}
    - {name: dma_cvt_va, profile: dma_va, topology: vf_pair, filter: "Dma*:Cvt*-Dma.iova_pa*", dma_auto: true}
    - {name: st20p_auto_pacing_pa, profile: auto_pacing_pa, topology: vf_pair, filter: "St20p.digest*:St20p.transport_*:St20p.frame_is_late:St20p.tx_*no_epoch_drop:Dma.iova_pa*-St20p.*ext*"}
    - {name: st20p_auto_pacing_va, profile: auto_pacing_va, topology: vf_pair, filter: "St20p.digest*:St20p.transport_*:St20p.frame_is_late:St20p.tx_*no_epoch_drop-St20p.*ext*"}
    - {name: noctx, profile: noctx, topology: cross_pf_quad, filter: "NoCtxTest.*-NoCtxTest.*_pf_*"}
    - {name: noctx_pf, profile: noctx_pf, topology: pf_pair, filter: "NoCtxTest.*_pf_*"}

groups:
  pr_core:
    - st2110_20
    - st2110_20p
    - st2110_20_tx_queue_cnt
    - st2110_22
    - st2110_3x_4x
  core_misc:
    - core_misc
    - redundant_stats
    - st20p_kernel_loopback
  pacing_dma:
    # Run st20p_tsc_pacing before any RL init (including dma_cvt_va). On DPDK
    # < 26.07.91, the ice PF keeps VF queue rate limits across processes.
    - st20p_tsc_pacing
    - dma_cvt_va
    - st20p_auto_pacing_pa
    - st20p_auto_pacing_va
  noctx:
    - noctx
    - noctx_pf
