# Single source of truth for MTL integration test profiles, topologies, and CI runs.
# Shared by tests/integration_tests/runner/ and the devtools test plan.

topologies:
  vf_pair:
    ports: 2
    kind: vf
    same_pf: true
  vf_quad:
    ports: 4
    kind: vf
    same_pf: true
  cross_pf_quad:
    ports: 4
    kind: vf
    cross_pf: true
    rx_timestamp: true
  pf_pair:
    ports: 2
    kind: pf
    rx_timestamp: true
  kernel_lo:
    ports: 0
    kind: kernel_socket

profiles:
  default: {}
  queue_cnt_24:
    extra_args: [--queue_cnt, "24"]
  dma_va:
    extra_args: [--iova_mode, va]
    iova_mode: va
  dma_pa:
    extra_args: [--iova_mode, pa]
    iova_mode: pa
  digest_tsc_pa:
    extra_args: [--rss_mode, l3_l4, --pacing_way, tsc, --iova_mode, pa, --multi_src_port]
    rss_mode: l3_l4
    pacing_way: tsc
    iova_mode: pa
  auto_pacing_pa:
    extra_args: [--rss_mode, l3_l4, --pacing_way, auto, --iova_mode, pa, --multi_src_port]
    rss_mode: l3_l4
    pacing_way: auto
    iova_mode: pa
  auto_pacing_va:
    extra_args: [--rss_mode, l3_l4, --pacing_way, auto, --iova_mode, va, --multi_src_port]
    rss_mode: l3_l4
    pacing_way: auto
    iova_mode: va
  tsc_pacing:
    extra_args: [--rss_mode, l3_l4, --pacing_way, tsc, --iova_mode, va, --multi_src_port]
    rss_mode: l3_l4
    pacing_way: tsc
    iova_mode: va
  kernel_lo:
    pmd: kernel_socket
  noctx:
    instance: own
    env:
      NOCTX_REQUIRE_STRICT: "1"
      MTL_ISOLATE: require
  noctx_pf:
    instance: own

runs:
  pr:
    - {name: st2110_20_rx_shard0, profile: default, topology: vf_pair, filter: "St20_rx*", dma_auto: true, env: {GTEST_TOTAL_SHARDS: "2", GTEST_SHARD_INDEX: "0"}}
    - {name: st2110_20_rx_shard1, profile: default, topology: vf_pair, filter: "St20_rx*", dma_auto: true, env: {GTEST_TOTAL_SHARDS: "2", GTEST_SHARD_INDEX: "1"}}
    - {name: st2110_20_tx_shard0, profile: default, topology: vf_pair, filter: "St20_tx*", dma_auto: true, env: {GTEST_TOTAL_SHARDS: "2", GTEST_SHARD_INDEX: "0"}}
    - {name: st2110_20_tx_shard1, profile: default, topology: vf_pair, filter: "St20_tx*", dma_auto: true, env: {GTEST_TOTAL_SHARDS: "2", GTEST_SHARD_INDEX: "1"}}
    - {name: st2110_20p, profile: default, topology: vf_pair, filter: "St20p*", dma_auto: true}
    - {name: st2110_20_tx_queue_cnt, profile: queue_cnt_24, topology: vf_pair, filter: "St20_tx.create_queue_cnt", dma_auto: true}
    - {name: st2110_22_rx, profile: default, topology: vf_pair, filter: "St22_rx*", dma_auto: true}
    - {name: st2110_22_tx, profile: default, topology: vf_pair, filter: "St22_tx*", dma_auto: true}
    - {name: st2110_22p, profile: default, topology: vf_pair, filter: "St22p*", dma_auto: true}
    - {name: st2110_3x, profile: default, topology: vf_pair, filter: "St3*", dma_auto: true}
    - {name: st2110_4x, profile: default, topology: vf_pair, filter: "St4*", dma_auto: true}
  nightly:
    - {name: Misc, profile: default, topology: vf_pair, filter: "Misc*", dma_auto: true}
    - {name: Main, profile: default, topology: vf_pair, filter: "Main*", dma_auto: true}
    - {name: Sch, profile: default, topology: vf_pair, filter: "Sch*", dma_auto: true}
    - {name: Cvt, profile: default, topology: vf_pair, filter: "Cvt*", dma_auto: true}
    - {name: st20s, profile: default, topology: vf_pair, filter: "St20s*", dma_auto: true}
    - {name: Dma_va, profile: dma_va, topology: vf_pair, filter: "Dma*", dma_auto: true}
    - {name: Dma_pa, profile: dma_pa, topology: vf_pair, filter: "Dma*", dma_auto: true}
    - {name: digest_1080p_timeout_interval, profile: digest_tsc_pa, topology: vf_pair, filter: "*digest_1080p_timeout_interval*", dma_auto: true}
    - {name: st20p_auto_pacing_pa, profile: auto_pacing_pa, topology: vf_pair, filter: "Main*:St20p*:-*ext*", dma_auto: true}
    - {name: st20p_auto_pacing_va, profile: auto_pacing_va, topology: vf_pair, filter: "Main*:St20p*:-*ext*", dma_auto: true}
    - {name: st20p_tsc_pacing, profile: tsc_pacing, topology: vf_pair, filter: "Main*:St20p*:-*ext*", dma_auto: true}
    - {name: redundant_stats, profile: default, topology: vf_quad, filter: "St20p.redundant*:St30p.redundant*:St40p.redundant*"}
    - {name: st20p_kernel_loopback, profile: kernel_lo, topology: kernel_lo, filter: "St20p*", needs_root: false}
    - {name: noctx, profile: noctx, topology: cross_pf_quad, filter: "NoCtxTest.*-NoCtxTest.*_pf_*"}
    - {name: noctx_pf, profile: noctx_pf, topology: pf_pair, filter: "NoCtxTest.*_pf_*"}

groups:
  pr_core:
    - st2110_20_rx_shard0
    - st2110_20_rx_shard1
    - st2110_20_tx_shard0
    - st2110_20_tx_shard1
    - st2110_20p
    - st2110_20_tx_queue_cnt
    - st2110_22_rx
    - st2110_22_tx
    - st2110_22p
    - st2110_3x
    - st2110_4x
  core_misc:
    - Misc
    - Main
    - Sch
    - Cvt
    - st20s
    - redundant_stats
    - st20p_kernel_loopback
  pacing_dma:
    - Dma_va
    - Dma_pa
    - digest_1080p_timeout_interval
    - st20p_auto_pacing_pa
    - st20p_auto_pacing_va
    - st20p_tsc_pacing
  noctx:
    - noctx
    - noctx_pf
