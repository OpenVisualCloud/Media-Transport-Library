[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mxl-k8s-qos-lab"
version = "0.1.0"
description = "Kubernetes CPU QoS and Intel RDT performance lab for FFmpeg-MXL"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4", "PyYAML>=6,<7", "requests>=2.31,<3", "jsonschema>=4,<5"]

[project.optional-dependencies]
# scripts/setup.sh installs this extra so make test works immediately.
dev = ["pytest>=7"]

[project.scripts]
mxl-perf = "mxlperf.cli:main"
mxl-crm-manifest = "mxlperf.dmf_manifest:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]
