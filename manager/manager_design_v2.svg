<text x="58.0" y="934.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">MTL Manager: key points</text>
<circle cx="62" cy="978.7" r="5" fill="#1F271B"/>
<text x="78.0" y="986.0" font-size="22" fill="#1F271B" text-anchor="start">MTL Manager is a daemon that runs as root.</text>
<circle cx="62" cy="1013.9" r="5" fill="#1F271B"/>
<text x="78.0" y="1021.2" font-size="22" fill="#1F271B" text-anchor="start">It manages the life cycle and configuration of MTL instances.</text>
<circle cx="62" cy="1049.1" r="5" fill="#1F271B"/>
<text x="78.0" y="1056.4" font-size="22" fill="#1F271B" text-anchor="start">Lcore management: each instance knows the lcores that other instances use.</text>
<circle cx="62" cy="1084.3" r="5" fill="#1F271B"/>
<text x="78.0" y="1091.6" font-size="22" fill="#1F271B" text-anchor="start">eBPF/XDP loader: loads and manages the eBPF/XDP programs.</text>
<circle cx="62" cy="1119.5" r="5" fill="#1F271B"/>
<text x="78.0" y="1126.8" font-size="22" fill="#1F271B" text-anchor="start">NIC configuration: adds and deletes flow and queue settings.</text>
<circle cx="62" cy="1154.7" r="5" fill="#1F271B"/>
<text x="78.0" y="1162.0" font-size="22" fill="#1F271B" text-anchor="start">Instances monitor: reports status, and clears it when a client crashes or disconnects.</text>
