<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1280" viewBox="0 0 1400 1280" role="img" aria-labelledby="t d">
<title id="t">MTL Manager design</title>
<desc id="d">MTL instances connect to mtl_manager.sock and send messages. The MTL Manager listens on the socket, receives the messages, and loads or unloads the XDP program in the Linux kernel. Each AF_XDP socket adds itself to xsks_map, and the UDP port filter is kept in udp_filter_map. Packets flow between XDP and the AF_XDP socket. The manager does lcore management, XDP loading, NIC management, and clears the status when a client crashes or disconnects.</desc>
