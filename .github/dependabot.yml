version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: pip
    directory: /.github/mcp
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "
    ignore:
      # mcp 2.0 removed mcp.server.fastmcp, which both servers import
      - dependency-name: mcp
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /doc/sphinx
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: cargo
    directory: /tests/tools/perf_debug_mcp/native
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: docker
    directory: /manager
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "