version: 2
updates:
  - package-ecosystem: github-actions
    # The workflows and the composite actions they call
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "
    # One pull request per run, not one per action
    groups:
      actions:
        patterns: ["*"]
    # The workflows pin this action to a commit of main, so each push to main
    # outdates the pin. Bump it by hand when the action changes.
    ignore:
      - dependency-name: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "
    groups:
      tests:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  # The Bandit and CodeChecker releases of the Code scan workflow
  - package-ecosystem: pip
    directory: /.github/code-scan
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: docker
    directory: /manager
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "
    # Digest updates only: the manager image stays on Ubuntu 24.04 LTS.
    ignore:
      - dependency-name: ubuntu
        versions: [">24.04"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "