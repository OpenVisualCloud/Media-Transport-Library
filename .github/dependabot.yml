version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  # The Bandit and CodeChecker releases of the Code scan workflow
  - package-ecosystem: pip
    directory: /.github/code-scan
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "

  - package-ecosystem: docker
    directory: /manager
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "
    # Digest updates only: the manager image stays on Ubuntu 24.04 LTS.
    ignore:
      - dependency-name: ubuntu
        versions: [">24.04"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "Ci: "