---
name: Bandit

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'maint-**'
  pull_request:
    branches:
      - main
      - 'maint-**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      bandit: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.bandit == 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/path_filters.yml

  # Security scan of every tracked Python file with the Bandit test set in
  # BANDIT_CONFIG. Why this is not a pre-commit hook: doc/coding_standard.md
  # section 4.
  #
  # Any finding fails the job. Fix the code, or review it and mark the flagged
  # line `# nosec <ID>`, with the review result after a second '#' or on the
  # line above:
  #   import subprocess  # nosec B404 # <what the review found>
  # Never write the reason straight after the ID: Bandit reads every word up to
  # the next '#' as a test ID or name, so the reason can silence other tests.
  bandit:
    name: Bandit
    needs: changes
    if: ${{ needs.changes.outputs.bandit == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: python -m pip install -r .github/code-scan/requirements.txt

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

      # The reports come before the scan, so that they exist when it fails.
      - name: Write Bandit reports
        run: task ci:bandit-reports

      - name: Summarize Bandit results
        run: task ci:bandit-summary

      # Both uploads only report: a failed upload must not decide the check or
      # stop the scan below from running.
      - name: Upload Bandit reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: bandit-report
          path: |
            bandit.html
            bandit.json
            bandit.sarif

      # A pull request from a fork gets a read-only token, so it cannot upload.
      # Dependabot's token is raised by the job permissions above.
      - name: Upload Bandit results to code scanning
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        continue-on-error: true
        with:
          sarif_file: bandit.sarif
          category: bandit

      # The console report, and the step that fails on any finding. Run the
      # same task locally.
      - name: Run Bandit
        run: task ci:bandit

      - name: Check that Bandit scanned every file
        run: task ci:bandit-skipped

  # The check for branch protection to require: it reports on every run, and
  # fails only when the scan failed or was cancelled, not when it was skipped
  # because no Python changed.
  bandit-result:
    name: bandit-result
    needs: [changes, bandit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Bandit ok
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Bandit failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
