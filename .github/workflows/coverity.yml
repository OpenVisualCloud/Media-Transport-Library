name: Coverity Build


on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  MTL_BUILD_DISABLE_PCAPNG: true
  PREFIX_DIR: /usr/local
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

jobs:
  coverity:
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 90
    steps:
    - name: 'Harden Runner'
      uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
      with:
        egress-policy: audit

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
          ref: main

    - name: 'Install Task'
      uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0


    - name: 'Install dependencies'
      run: task ci:workflow -- coverity-dependencies

    - name: 'Build and install DPDK'
      run: task ci:workflow -- coverity-dpdk

    - name: 'Run coverity'
      uses: vapier/coverity-scan-action@2068473c7bdf8c2fb984a6a40ae76ee7facd7a85 # v1.8.0
      with:
        project: 'Media-transport-Library'
        email: ${{ secrets.COVERITY_EMAIL }}
        token: ${{ secrets.COVERITY_TOKEN }}
        build_language: 'cxx'
        build_platform: 'linux64'
        working-directory: '${{ github.workspace }}'
        command: ./build.sh
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverity-reports
        path: '${{ github.workspace }}/cov-int'
