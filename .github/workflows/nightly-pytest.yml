name: nightly-pytest
on:
  # allow manually trigger
  workflow_dispatch:
  schedule:
  - cron: '0 20 * * 1-5' # Monday to Friday at 8 PM UTC
permissions:
  contents: read
  checks: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      skip_linter_check: true
    permissions:
      contents: read
      checks: read
  run-pytest:
    needs: build
    strategy:
      matrix:
        nic:
          - e810
          - e830
          - e835
        dir:
          - cross_app
          - st40p
          - gstreamer
          - kernel_socket
          - ptp
          - rss_mode
          - rx_timing
          - st20p
          - st22p
          - st30p
          - st41
          - udp
          - virtio_user
          - xdp
      fail-fast: false
    runs-on: ${{ matrix.nic }}
    timeout-minutes: 720
    steps:
      - name: 'preparation: Harden Runner'
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - name: 'preparation: Checkout MTL'
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@2f540b33d05ab93541c816182b791c0fb6b5d143
        with:
          ref: '${{ github.ref }}'
      - name: 'preparation: Validate host and download artifacts'
        uses: ./.github/actions/validate-host

      - name: 'cleanup: Kill stale processes before test'
        uses: ./.github/actions/cleanup

      - name: 'installation: Install pipenv environment'
        id: pipenv-install
        run: task ci:pytest-setup -- install
      - name: Create session ID
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: task ci:pytest-setup -- session
      - name: Set PCI device env variable
        env:
          NIC: ${{ matrix.nic }}
        run: task ci:pytest-setup -- pci
      - name: Generate test framework config files
        env:
          SESSION_ID: ${{ env.SESSION_ID }}
          MTL_PATH: ${{ secrets.RUNNER_MTL_PATH }}
          PCI_DEVICE: ${{ env.PCI_DEVICE }}
          RUNNER_USERNAME: ${{ secrets.RUNNER_USERNAME }}
          EBU_IP: ${{ secrets.RUNNER_EBU_LIST_IP }}
          EBU_USER: ${{ secrets.RUNNER_EBU_LIST_USER }}
          EBU_PASSWORD: ${{ secrets.RUNNER_EBU_LIST_PASSWORD }}
        run: task ci:pytest-setup -- config-single
      - name: Export workflow tag for PCAP naming
        env:
          WORKFLOW_TAG: ${{ github.workflow }}:${{ matrix.nic }}
        run: task ci:pytest-setup -- tag
      - name: 'execution: Run nightly-bare-metal tests in virtual environment'
        env:
          TEST_PATH: ${{ matrix.dir }}
        run: task ci:pytest-run -- nightly
      - name: 'collect: System status report'
        if: always()
        env:
          STATUS_NAME: system-info-${{ matrix.nic }}-${{ matrix.dir }}
        run: task ci:report -- status
      - name: "upload report python"
        if: always()
        id: upload-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-test-report-${{ matrix.nic }}-${{ matrix.dir }}
          path: ./tests/acceptance/report.html

      - name: 'cleanup: Kill test processes'
        if: always()
        uses: ./.github/actions/cleanup

      - name: "upload system info"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-info-${{ matrix.nic }}-${{ matrix.dir }}
          path: ./system-info-${{ matrix.nic }}-${{ matrix.dir }}

  aggregate-python-reports:
    needs: run-pytest
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: 'preparation: Checkout MTL'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
      - name: Download python report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-test-report-*
          path: python-reports  # Downloads all artifacts into this directory
          merge-multiple: false  # Each artifact in separate subdirectory
      - name: Flatten report directory structure
        run: task ci:report -- flatten-pytest
      - name: Install report dependencies
        run: task ci:report -- install-dependencies
      - name: Combine python reports
        id: combine
        run: task ci:report -- combine-pytest
      - name: Upload combined python report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-pytest-combined-report
          path: ${{ steps.combine.outputs.report_path }}
