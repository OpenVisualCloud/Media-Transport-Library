---
name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'maint-**'
  pull_request:
    branches:
      - main
      - 'maint-**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      unit_tests: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.unit_tests == 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/path_filters.yml

  # The unit tier needs no NIC and no root, so it is the cheapest gate MTL has.
  # It still needs DPDK headers and libraries to compile.
  unit-tests:
    needs: changes
    if: ${{ needs.changes.outputs.unit_tests == 'true' }}
    # One entry keeps the runner image label in one place.
    strategy:
      matrix:
        os: [ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Nothing installs MTL here; setup_environment.sh takes the dirname of this
      # to place DPDK under a workspace-local path instead of system-wide.
      MTL_INSTALL_PREFIX: ${{ github.workspace }}/.local_install/mtl
      PKG_CONFIG_PATH: ${{ github.workspace }}/.local_install/dpdk/lib/x86_64-linux-gnu/pkgconfig
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies and DPDK
        env:
          SETUP_ENVIRONMENT: '1'
          CICD_BUILD: '1'
          SETUP_BUILD_AND_INSTALL_DPDK: '1'
        run: bash .github/scripts/ci/unit-test-dependencies.sh

      - name: Build and run the unit suite
        run: ./build.sh unit

      - name: Build and run the unit suite under ASan and UBSan
        run: ./build.sh unit sanitize

  # The one check to require in branch protection. It always runs, so it
  # reports even when the path filter skips the unit tests, and it fails only
  # if a job it needs failed or was cancelled.
  unit-tests-result:
    name: unit-tests-result
    needs: [changes, unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All unit tests ok
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Some unit tests failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
