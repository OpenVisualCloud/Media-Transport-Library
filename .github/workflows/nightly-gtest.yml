name: nightly-gtest
on:
  # allow manually trigger
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA to test (leave empty for current tip)'
        required: false
        default: ''
  schedule:
  - cron: '7 18 * * 1-5' # Monday to Friday at 18:07 UTC
permissions:
  contents: read
  checks: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      skip_linter_check: true
    permissions:
      contents: read
      checks: read
      # The changes job of build.yml asks for it, and a called job gets no
      # permission that its caller does not grant.
      pull-requests: read

  run-gtest:
    needs: build
    concurrency:
      group: gtest-${{ github.workflow }}-${{ github.ref }}-${{ matrix.nic }}
      cancel-in-progress: true
    strategy:
      matrix:
        nic:
          - e810
          - e830
          - e835
      fail-fast: false
    runs-on: ${{ matrix.nic }}
    timeout-minutes: 300
    steps:
      - name: 'preparation: Harden Runner'
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: 'preparation: Checkout MTL'
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@497c4107ae027a4f9d6da088d027639df40064e3
        with:
          ref: '${{ inputs.commit_sha || github.sha }}'
      - name: 'preparation: Validate host and download artifacts'
        uses: ./.github/actions/validate-host

      - name: 'cleanup: Kill stale processes before test'
        uses: ./.github/actions/cleanup

      # env -u BASH_XTRACEFD for the same reason as gtest-bare-metal.yml: the
      # descriptor the variable names does not exist in the privileged shell.
      - name: 'preparation: Bind the test ports'
        run: sudo -E env -u BASH_XTRACEFD "$TASK_BIN" ci:bind-test-ports

      - name: run gtest bare metal
        env:
          NIGHTLY: 1
          EXIT_ON_FAILURE: 0
          LOG_FILE: "${{ github.workspace }}/gtest.log"
          TEST_CASE_TIMEOUT: 1800
        run: task ci:gtest-nightly
      - name: 'cleanup: Kill test processes'
        if: always()
        uses: ./.github/actions/cleanup
      - name: 'collect: System status report'
        if: always()
        env:
          STATUS_NAME: system-info-${{ matrix.nic }}
        run: task ci:report -- status
      - name: "upload report gtest"
        if: always()
        id: upload-report-gtest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-gtest-report-${{ matrix.nic }}
          path: |
            gtest.log

      - name: "upload system info"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system-info-${{ matrix.nic }}
          path: system-info-${{ matrix.nic }}/
