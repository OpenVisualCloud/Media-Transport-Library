name: custom-pytest
on:
  workflow_dispatch:
    inputs:
      nic:
        description: NIC
        required: true
        type: choice
        options:
          - e810
          - e830
          - e825
          - e835
      marker:
        description: Marker
        required: false
        type: string
      test_filter:
        description: 'Pytest keyword filter (-k), e.g. test_st20p_resolutions'
        required: false
        type: string
      dir:
        description: 'Directory (subdirectory of tests/acceptance) or a specific test path'
        required: true
        type: string
        default: tests
      shadow_host:
        description: 'Path to shadow host credentials file (IP/USER) on the runner. Empty uses the runner default.'
        required: false
        type: string
        default: ''
      enable_shadow_host:
        description: 'Enable shadow host sync'
        required: false
        type: boolean
        default: false
      branch:
        description: 'MTL branch, tag or full 40-char SHA to build and test; CI and tests stay from the workflow branch (empty = workflow branch)'
        required: false
        type: string

permissions:
  contents: read
  checks: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      skip_linter_check: true
      branch: ${{ inputs.branch }}
    permissions:
      contents: read
      checks: read
      # The changes job of build.yml asks for it, and a called job gets no
      # permission that its caller does not grant.
      pull-requests: read

  run-pytest:
    needs: build
    runs-on: "${{ inputs.nic }}"
    timeout-minutes: 720
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Set current date
        run: echo "CURRENT_DATE=$(date '+%y%m%d-%H%M%S')" >> "$GITHUB_ENV"
      - name: Checkout MTL
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@c382b88f7723f3187e52925364014732ba34d4c2
        with:
          ref: "${{ needs.build.outputs.mtl_commit }}"
          fetch-depth: ${{ inputs.branch && '0' || '1' }}
      - name: Install Task
        if: inputs.branch != ''
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
      # Twice: the branch's own overlay-tests may be older than the workflow
      # commit's. The first run checks out the workflow commit's copy, the
      # second runs it.
      - name: Overlay CI and tests from the workflow commit
        if: inputs.branch != ''
        env:
          MTL_SOURCE: ${{ inputs.branch }}
          TEST_SHA: ${{ github.sha }}
          TEST_REF: ${{ github.ref_name }}
        run: task ci:workflow -- overlay-tests && task ci:workflow -- overlay-tests
      - name: Validate host and download stashes
        id: validate
        uses: ./.github/actions/validate-host
        with:
          shadow_host: ${{ inputs.enable_shadow_host && (inputs.shadow_host || '/etc/mtl-ci/shadow-host') || '' }}
          build_outputs: ${{ toJSON(needs.build.outputs) }}
      - name: Ensure the acceptance virtualenv
        run: task ci:pytest-setup -- ensure
      - name: Verify the login the suite makes
        run: task ci:pytest-setup -- connection
      - name: Set session ID
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: task ci:pytest-setup -- session
      - name: Set PCI device
        env:
          NIC: ${{ inputs.nic }}
        run: task ci:pytest-setup -- pci
      - name: Generate pytest configuration files
        env:
          SESSION_ID: ${{ env.SESSION_ID }}
          PCI_DEVICE: ${{ env.PCI_DEVICE }}
        run: task ci:pytest-setup -- config-single
      - name: Export workflow tag for PCAP naming
        env:
          WORKFLOW_TAG: ${{ github.workflow }}:${{ inputs.nic }}
        run: task ci:pytest-setup -- tag

      - name: 'cleanup: Kill stale processes before test'
        uses: ./.github/actions/cleanup

      - name: Run tests
        run: task ci:pytest-run -- custom
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
          PYTEST_MARKER: ${{ inputs.marker }}
          PYTEST_FILTER: ${{ inputs.test_filter }}
          TEST_PATH: ${{ inputs.dir }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "custom-test-report-${{ env.CURRENT_DATE }}"
          path: ./tests/acceptance/report.html

      - name: 'cleanup: Kill test processes'
        if: always()
        uses: ./.github/actions/cleanup
