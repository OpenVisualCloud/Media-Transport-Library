name: custom-pytest
on:
  workflow_dispatch:
    inputs:
      nic:
        description: NIC
        required: true
        type: choice
        options:
          - e810
          - e830
          - e825
          - e835
      marker:
        description: Marker
        required: false
        type: string
      test_filter:
        description: 'Pytest keyword filter (-k), e.g. test_st20p_resolutions'
        required: false
        type: string
      dir:
        description: 'Directory (subdirectory of tests/acceptance) or a specific test path'
        required: true
        type: string
        default: tests
      shadow_host:
        description: 'Path to shadow host credentials file (IP/USER) on the runner. Empty uses the runner default.'
        required: false
        type: string
        default: ''
      enable_shadow_host:
        description: 'Enable shadow host sync'
        required: false
        type: boolean
        default: false
      branch:
        description: 'MTL branch, tag or full 40-char SHA to build and test; CI and tests stay from the workflow branch (empty = workflow branch)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: dpdk
    timeout-minutes: 60
    outputs:
      mtl_commit: ${{ steps.build.outputs.mtl_commit }}
      mtl_hash: ${{ steps.build.outputs.mtl_hash }}
      jpegxs_hash: ${{ steps.build.outputs.jpegxs_hash }}
      ice_hash: ${{ steps.build.outputs.ice_hash }}
      ffmpeg_hash: ${{ steps.build.outputs.ffmpeg_hash }}
      gstreamer_hash: ${{ steps.build.outputs.gstreamer_hash }}
      plugins_hash: ${{ steps.build.outputs.plugins_hash }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The branch is resolved to a commit here, once. The test job checks out
      # that commit, never the branch again.
      - name: Checkout MTL
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@497c4107ae027a4f9d6da088d027639df40064e3
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: ${{ inputs.branch && '0' || '1' }}

      - name: Install Task
        if: inputs.branch != ''
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0

      # Before the first local action: GitHub loads it from this checkout, and
      # the ref may have none, or an older one. Twice: the ref's own
      # overlay-tests may be older than the workflow commit's. The first run
      # checks out the workflow commit's copy, the second runs it.
      - name: Overlay CI and tests from the workflow commit
        if: inputs.branch != ''
        env:
          MTL_SOURCE: ${{ inputs.branch }}
          TEST_SHA: ${{ github.sha }}
          TEST_REF: ${{ github.ref_name }}
        run: task ci:workflow -- overlay-tests && task ci:workflow -- overlay-tests

      - name: Build the artifacts
        id: build
        uses: ./.github/actions/build-artifacts

  run-pytest:
    needs: build
    runs-on: "${{ inputs.nic }}"
    timeout-minutes: 720
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Set current date
        run: echo "CURRENT_DATE=$(date '+%y%m%d-%H%M%S')" >> "$GITHUB_ENV"
      - name: Checkout MTL
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@497c4107ae027a4f9d6da088d027639df40064e3
        with:
          ref: "${{ needs.build.outputs.mtl_commit }}"
          fetch-depth: ${{ inputs.branch && '0' || '1' }}
      - name: Install Task
        if: inputs.branch != ''
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      # Twice: the branch's own overlay-tests may be older than the workflow
      # commit's. The first run checks out the workflow commit's copy, the
      # second runs it.
      - name: Overlay CI and tests from the workflow commit
        if: inputs.branch != ''
        env:
          MTL_SOURCE: ${{ inputs.branch }}
          TEST_SHA: ${{ github.sha }}
          TEST_REF: ${{ github.ref_name }}
        run: task ci:workflow -- overlay-tests && task ci:workflow -- overlay-tests
      - name: Validate host and download stashes
        uses: ./.github/actions/validate-host
        with:
          shadow_host: ${{ inputs.enable_shadow_host && (inputs.shadow_host || '/etc/mtl-ci/shadow-host') || '' }}
          build_outputs: ${{ toJSON(needs.build.outputs) }}
      - name: Set up the acceptance suite
        uses: ./.github/actions/pytest-setup
        with:
          nic: ${{ inputs.nic }}
      - name: Run tests
        run: task ci:pytest-run -- custom
        env:
          PYTEST_MARKER: ${{ inputs.marker }}
          PYTEST_FILTER: ${{ inputs.test_filter }}
          TEST_PATH: ${{ inputs.dir }}
      - name: Report and cleanup
        if: always()
        uses: ./.github/actions/pytest-collect
        with:
          report_name: custom-test-report-${{ env.CURRENT_DATE }}
          report_path: ./tests/acceptance/report.html
