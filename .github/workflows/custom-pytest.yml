name: custom-pytest
on:
  workflow_dispatch:
    inputs:
      nic:
        description: NIC
        required: true
        type: choice
        options:
          - e810
          - e830
          - e825
          - e835
      marker:
        description: Marker
        required: false
        type: string
      test_filter:
        description: 'Pytest keyword filter (-k), e.g. test_st20p_resolutions'
        required: false
        type: string
      dir:
        description: 'Directory (subdirectory of tests/acceptance) or a specific test path'
        required: true
        type: string
        default: tests
      shadow_host:
        description: 'Path to shadow host credentials file (IP/USER). Leave empty to use secret.'
        required: false
        type: string
        default: ''
      enable_shadow_host:
        description: 'Enable shadow host sync'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      skip_linter_check: true

  run-pytest:
    needs: build
    runs-on: "${{ inputs.nic }}"
    timeout-minutes: 720
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - name: Set current date
        run: echo "CURRENT_DATE=$(date '+%y%m%d-%H%M%S')" >> "$GITHUB_ENV"
      - name: Checkout MTL
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@main
        with:
          ref: "${{ github.ref }}"
      - name: Validate host and download stashes
        id: validate
        uses: ./.github/actions/validate-host
        with:
          shadow_host: ${{ inputs.enable_shadow_host && (inputs.shadow_host || secrets.SHADOW_HOST) || '' }}
      - name: Install pytest dependencies
        run: task ci:pytest-setup -- install
      - name: Set session ID
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: task ci:pytest-setup -- session
      - name: Set PCI device
        env:
          NIC: ${{ inputs.nic }}
        run: task ci:pytest-setup -- pci
      - name: Generate pytest configuration files
        env:
          SESSION_ID: ${{ env.SESSION_ID }}
          MTL_PATH: ${{ secrets.RUNNER_MTL_PATH }}
          PCI_DEVICE: ${{ env.PCI_DEVICE }}
          RUNNER_USERNAME: ${{ secrets.RUNNER_USERNAME }}
          EBU_IP: ${{ secrets.RUNNER_EBU_LIST_IP }}
          EBU_USER: ${{ secrets.RUNNER_EBU_LIST_USER }}
          EBU_PASSWORD: ${{ secrets.RUNNER_EBU_LIST_PASSWORD }}
        run: task ci:pytest-setup -- config-single
      - name: Export workflow tag for PCAP naming
        env:
          WORKFLOW_TAG: ${{ github.workflow }}:${{ inputs.nic }}
        run: task ci:pytest-setup -- tag

      - name: 'cleanup: Kill stale processes before test'
        uses: ./.github/actions/cleanup

      - name: Run tests
        run: task ci:pytest-run -- custom
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
          PYTEST_MARKER: ${{ inputs.marker }}
          PYTEST_FILTER: ${{ inputs.test_filter }}
          TEST_PATH: ${{ inputs.dir }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "custom-test-report-${{ env.CURRENT_DATE }}"
          path: ./tests/acceptance/report.html

      - name: 'cleanup: Kill test processes'
        if: always()
        uses: ./.github/actions/cleanup
