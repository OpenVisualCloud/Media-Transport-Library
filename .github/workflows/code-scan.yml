name: Code scan

# clang-tidy on the C and C++ lines that a change touches, and cargo-audit on
# the Rust lock files. clang-tidy reads the compile commands of a build, so it
# waits for the Build workflow through pr-gate.yml. code-scan-result is the one
# check name that branch protection needs.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'maint-**'
  pull_request:
    branches:
      - main
      - 'maint-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      cargo_audit: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cargo_audit == 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/path_filters.yml

  pr-gate:
    if: ${{ github.event_name != 'push' }}
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    with:
      filter: clang_tidy

  clang-tidy:
    needs: pr-gate
    if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute source checksums
        id: sums
        uses: ./.github/actions/source-checksums

      - name: Compute exact cache keys
        id: keys
        env:
          HASH_DPDK: ${{ steps.sums.outputs.dpdk }}
          HASH_MTL: ${{ steps.sums.outputs.mtl }}
          HASH_JPEGXS: ${{ steps.sums.outputs.jpegxs }}
          HASH_ICE: ${{ steps.sums.outputs.ice }}
          HASH_FFMPEG: ${{ steps.sums.outputs.ffmpeg }}
          HASH_GSTREAMER: ${{ steps.sums.outputs.gstreamer }}
          HASH_PLUGINS: ${{ steps.sums.outputs.plugins }}
        run: task ci:cache-keys

      - name: 'stash: Restore DPDK cache'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.keys.outputs.dpdk_key }}
          path: .local_install/dpdk
          fail-on-cache-miss: true

      - name: 'stash: Restore MTL cache'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.keys.outputs.mtl_key }}
          path: .local_install/mtl
          fail-on-cache-miss: true

      - name: Write compile_commands.json
        run: task ci:clang-tidy-setup

      # The checks of .clang-tidy, on the lines that the pull request changes.
      # The findings go to the log as annotations, to the job summary, and to
      # the clang-tidy-report artifact.
      - name: clang-tidy
        id: lint
        uses: cpp-linter/cpp-linter-action@8120e05c7fbd25fa09fa93424ec49f55f7b304ab # v2.23.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 14
          style: ''
          tidy-checks: ''
          database: .
          lines-changed-only: true
          extra-args: -Wno-error
          step-summary: true
          summary-output-file: clang-tidy-summary.md

      # compile_commands.json holds the flags each file was checked with.
      - name: Upload the clang-tidy report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clang-tidy-report
          path: |
            clang-tidy-summary.md
            compile_commands.json

      - name: Fail on a clang-tidy finding
        if: ${{ steps.lint.outputs.checks-failed > 0 }}
        run: exit 1

  cargo-audit:
    needs: changes
    if: ${{ needs.changes.outputs.cargo_audit == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-audit@0.22.2

      - name: cargo-audit
        run: task ci:cargo-audit

      - name: Upload the cargo-audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-audit
          path: cargo-audit/

  code-scan-result:
    name: code-scan-result
    needs: [changes, pr-gate, clang-tidy, cargo-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All scans ok
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: A scan failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
