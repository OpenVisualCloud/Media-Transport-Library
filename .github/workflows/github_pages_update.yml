name: documentation-build-and-publish
on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    paths:
      - '**.md'
      - '**.rst'
      - 'doc/**'
      - 'VERSION'
      - '.github/workflows/github_pages_update.yml'
      - '.github/scripts/ci/workflow-ops.sh'

env:
  DEBIAN_FRONTEND: noninteractive

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # See doc/sphinx/build_docs.md: this job runs the steps of that guide.
  buildDocumentation:
    name: Build documentation
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 20
    steps:
      - name: Secure the runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

      - name: Prepare operating system for documentation build
        run: task ci:workflow -- docs-dependencies

      - name: Prepare environment for documentation build
        run: |
          python3 -m venv "${RUNNER_TEMP}/venv-docs"
          "${RUNNER_TEMP}/venv-docs/bin/python3" -m pip install -r doc/sphinx/requirements.txt
          echo "${RUNNER_TEMP}/venv-docs/bin" >> "${GITHUB_PATH}"

      - name: Build documentation
        run: make -C doc/sphinx html SPHINXOPTS="-W --keep-going"

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./doc/_build/html

  publishGitHubPages:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: buildDocumentation
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: 'ubuntu-22.04'
    timeout-minutes: 20
    steps:
      - name: Secure the runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      # With the "Deploy from a branch" source, GitHub serves a Jekyll build of
      # the Markdown files, and this Sphinx site never goes live.
      - name: Check the GitHub Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type || echo unknown)
          if [ "${build_type}" != "workflow" ]; then
            echo "::warning::GitHub Pages source is '${build_type}', not 'workflow'. GitHub does not serve this Sphinx site. Set Settings > Pages > Source to GitHub Actions."
          fi

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
