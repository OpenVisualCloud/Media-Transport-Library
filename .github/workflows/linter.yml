---
name: Linter

on: [pull_request]

permissions:
  contents: read

env:
  # A workspace-relative cache location is the one path that works identically on
  # Linux, macOS and Windows runners.
  PRE_COMMIT_HOME: ${{ github.workspace }}/.pre-commit-cache
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  # Every style and lint rule this repository enforces lives in
  # .pre-commit-config.yaml, and this job runs it through the same entry point
  # developers and the git hooks use. This workflow must stay orchestration-only:
  # if you find yourself adding a rule or a config path here, it belongs in
  # .pre-commit-config.yaml instead. See doc/coding_standard.md.
  checkpatch:
    # Lint Code Base below aggregates every platform into the stable check-run
    # name consumed by build.yml.
    name: checkpatch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # for actions/checkout to fetch code
    strategy:
      fail-fast: false
      matrix:
        # Three OSes because the toolchain claims to be cross-platform; a claim
        # nobody runs is a claim that is already broken.
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-${{ matrix.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: Run checkpatch
        run: ./checkpatch.sh

  # Checks that checkpatch does not reproduce yet, kept as an explicitly named
  # job rather than dropped quietly. Each one has a recorded reason and a
  # migration path in the parity table in doc/coding_standard.md.
  #
  # This is an allow-list: super-linter runs *only* the validators set true here,
  # and it refuses to start if true and false values are mixed, so no
  # VALIDATE_*: false line may be added below. That is also what now keeps
  # ansible-lint off: it walks into the tracked skill symlinks and then fails on
  # super-linter v6's own bundled .ansible-lint.yml, which its ansible-lint
  # rejects for the unexpected 'parseable' key. There is no Ansible here to
  # check, so it simply never appears in this list -- the explicit
  # VALIDATE_ANSIBLE: false the deny-list needed would now stop the job starting.
  residual-linters:
    name: Lint checks not yet in checkpatch
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper
          # list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_LEVEL: WARN
          # On by default since super-linter 8.4.0; this job's token can only read.
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          # .sh files must keep their executable bit. Trivial to check but there
          # is no upstream pre-commit hook with these exact semantics -- the
          # nearest one, check-shebang-scripts-are-executable, is broader and
          # fails 17 pre-existing files.
          VALIDATE_BASH_EXEC: true
          # Secret scanning. The pre-commit gitleaks hook runs
          # `gitleaks protect --staged`, which scans the staged diff and is a
          # no-op for --all-files, so checkpatch cannot replace this. The old
          # deny-list workflow ran it by default; keeping it explicit here is
          # what stops the allow-list conversion from dropping it silently.
          VALIDATE_GITLEAKS: true
          # eslint over 135 *.ts. Cannot move into checkpatch until
          # tests/tools/perf_debug_mcp/package.json is tracked -- .gitignore's
          # blanket `*.json` currently excludes it, so the project has no
          # buildable or lintable configuration from a clean clone.
          VALIDATE_TYPESCRIPT_ES: true
          # rustfmt and clippy. All three edition validators were active before
          # this split and stay active; narrowing them to 2021, which is what
          # every Cargo.toml declares, would be a rule change.
          VALIDATE_RUST_2015: true
          VALIDATE_RUST_2018: true
          VALIDATE_RUST_2021: true
          VALIDATE_RUST_CLIPPY: true

  lint-result:
    name: Lint Code Base
    needs: [checkpatch, residual-linters]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Require successful file linters
        env:
          CHECKPATCH_RESULT: ${{ needs.checkpatch.result }}
          RESIDUAL_RESULT: ${{ needs.residual-linters.result }}
        run: task ci:require-file-linters

  # Commit-message style -- the one check that is neither a file linter nor part
  # of the super-linter allow-list, because gitlint reads a commit message and no
  # whole-tree file scan has one. It runs the exact commit-msg hook from
  # .pre-commit-config.yaml (same pinned gitlint, same .github/linters/.gitlint
  # rules) against every commit the pull request adds, so this job cannot enforce
  # anything the local git hook does not. This stays orchestration-only: the
  # rules are in the config, never here.
  #
  # Deliberately NOT wired into build.yml's wait-for-linter gate: a message-style
  # miss should fail the pull request, not skip a DPDK compile, and the gate's
  # fragile by-name coupling (doc/coding_standard.md section 4.1) is not worth the
  # landmine for a prose check.
  commit-messages:
    name: Commit message style
    runs-on: ubuntu-latest
    permissions:
      contents: read # for actions/checkout to fetch code

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit and every commit in the PR to walk the range.
          fetch-depth: 0

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          repo-token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PRE_COMMIT_HOME }}
          key: pre-commit-commit-msg-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"

      - name: Lint pull-request commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: task ci:lint-commit-messages
