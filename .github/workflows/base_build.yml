name: Base Build

on:
  # allow manually trigger
  workflow_dispatch:
  push:
    branches:
      - main
      - 'maint-**'
  pull_request:
    branches:
      - main
      - 'maint-**'
env:
  MTL_BUILD_AND_INSTALL: 1
  SETUP_ENVIRONMENT: 1
  CICD_BUILD: 1
  SETUP_BUILD_AND_INSTALL_DPDK: 1
  SETUP_BUILD_AND_INSTALL_GPU_DIRECT: 1
  HOOK_RUST: 1
  HOOK_PYTHON: 1
  ECOSYSTEM_BUILD_AND_INSTALL_FFMPEG_PLUGIN: 1
  ECOSYSTEM_BUILD_AND_INSTALL_GSTREAMER_PLUGIN: 1
  ECOSYSTEM_BUILD_AND_INSTALL_OBS_PLUGIN: 1
  TOOLS_BUILD_AND_INSTALL_MTL_READPCAP: 1
  TOOLS_BUILD_AND_INSTALL_MTL_CPU_EMULATOR: 1

# A superseded run of this workflow builds a commit nobody is looking at any
# more, and its four legs each spend most of an hour installing the same
# toolchain. Cancel it, like build.yml and the bare-metal workflows do, so the
# checks a pull request shows belong to its newest commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: read
    outputs:
      # https://stackoverflow.com/questions/70326569/github-workflow-how-to-conditionally-setup-env-for-all-subsequent-jobs
      base_build: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.base_build == 'true' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          filters: .github/path_filters.yml

  ubuntu-build:
    needs: changes
    if: ${{ needs.changes.outputs.base_build == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Two commits: on a pull request, the merge commit and its base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Build Release
        run: sudo -E .github/scripts/setup_environment.sh

      # The checks of .clang-tidy, on the C and C++ lines a pull request adds or
      # changes, with the compile commands of the build above. The scan must
      # fail on a macro planted in a commit on top, or a green run proves
      # nothing; the commit is dropped again.
      - name: clang-tidy
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          scan() {
            .github/scripts/ci/clang-tidy-changed.py clang-tidy-14 "$1" | .github/scripts/ci/changed-lines.py "$1"
          }
          printf '\n#define MT_PLANTED_SUM(a, b) a + b\n' >>lib/src/mt_util.c
          line=$(wc -l <lib/src/mt_util.c)
          git -c user.name=ci -c user.email=ci@localhost commit -q -am "clang-tidy control"
          if scan HEAD^1 >"${RUNNER_TEMP}/control.txt"; then
            echo "::error::the clang-tidy scan passed a planted macro"
            exit 1
          fi
          git reset -q --hard HEAD^1
          if ! grep -q "^lib/src/mt_util.c:${line}:[0-9]*: warning: .*\[bugprone-macro-parentheses\]" "${RUNNER_TEMP}/control.txt"; then
            echo "::error::the clang-tidy scan failed, but not on the planted macro"
            cat "${RUNNER_TEMP}/control.txt"
            exit 1
          fi
          if ! scan HEAD^1 >"${RUNNER_TEMP}/new.txt"; then
            sed 's/^\([^:]*\):\([0-9]*\):\([0-9]*\): \(.*\)$/::error file=\1,line=\2,col=\3::\4/' "${RUNNER_TEMP}/new.txt"
            exit 1
          fi

      - name: Build the Rust no_std example
        run: bash .github/scripts/ci/build-rust-example.sh

      - name: 'upload release build artifacts'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mtl-release-bin
          path: '${{ github.workspace }}/build/'

  ubuntu-ebpf-xdp-build:
    needs: changes
    if: ${{ needs.changes.outputs.base_build == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No separate prerequisite step: build_ebpf_xdp.sh checks the host before
      # it builds, and asserts the pinned xdp-tools and libbpf versions after
      # installing them.
      - name: ebpf-xdp build
        run: sudo -E .github/scripts/setup_environment.sh
        env:
          SETUP_BUILD_AND_INSTALL_EBPF_XDP: 1
          TOOLS_BUILD_AND_INSTALL_MTL_MONITORS: 1

  ubuntu-debug:
    needs: changes
    if: ${{ needs.changes.outputs.base_build == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Debug and fuzz build
        run: sudo -E .github/scripts/setup_environment.sh
        env:
          MTL_BUILD_AND_INSTALL: 1
          MTL_BUILD_AND_INSTALL_FUZZ: 1

  # The one check to require in branch protection. It always runs, so it
  # reports even when the path filter skips base builds, and it fails only if a
  # job it needs failed or was cancelled.
  base-build-result:
    name: base-build-result
    needs: [changes, ubuntu-build, ubuntu-ebpf-xdp-build, ubuntu-debug]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All base builds ok
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Some base builds failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
