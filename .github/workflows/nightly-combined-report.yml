name: Nightly Combined Report
# This workflow combines pytest and gtest nightly reports into unified Excel and HTML reports.
# 
# Trigger modes:
# 1. Automatic: Runs after nightly-pytest and nightly-gtest workflows complete (uses latest runs)
# 2. Manual (workflow_dispatch): Allows custom selection of specific runs
#    - Can specify branch for pytest/gtest (e.g., 'main', 'feature-branch')
#    - Can specify run number for pytest/gtest (e.g., '64', '65')
#    - Leave inputs empty to use latest completed runs
#    - Each test suite (pytest/gtest) can be configured independently

on:
  # Trigger after both nightly workflows complete
  workflow_run:
    workflows: ["nightly-gtest", "nightly-pytest"]
    types:
      - completed
  # Allow manual trigger with custom options
  workflow_dispatch:
    inputs:
      pytest_branch:
        description: 'Pytest branch (leave empty for latest completed run)'
        required: false
        type: string
      pytest_run_number:
        description: 'Pytest run number (e.g., 64, leave empty for latest)'
        required: false
        type: string
      gtest_branch:
        description: 'GTest branch (leave empty for latest completed run)'
        required: false
        type: string
      gtest_run_number:
        description: 'GTest run number (e.g., 65, leave empty for latest)'
        required: false
        type: string
      baseline_pytest_run_number:
        description: 'Baseline pytest run number for regression comparison (leave empty to skip)'
        required: false
        type: string
      baseline_gtest_run_number:
        description: 'Baseline gtest run number for regression comparison (leave empty to skip)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  wait-for-both-workflows:
    runs-on: ubuntu-22.04
    outputs:
      gtest_run_id: ${{ steps.get-runs.outputs.gtest_run_id }}
      pytest_run_id: ${{ steps.get-runs.outputs.pytest_run_id }}
      baseline_pytest_run_id: ${{ steps.get-runs.outputs.baseline_pytest_run_id }}
      baseline_gtest_run_id: ${{ steps.get-runs.outputs.baseline_gtest_run_id }}
      both_completed: ${{ steps.check-status.outputs.both_completed }}
    steps:
      - name: 'preparation: Harden Runner'
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: 'preparation: Checkout MTL'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

      - name: Wait for both workflows to complete
        id: get-runs
        uses: actions/github-script@v9
        env:
          PYTEST_BRANCH: ${{ github.event.inputs.pytest_branch }}
          PYTEST_RUN_NUMBER: ${{ github.event.inputs.pytest_run_number }}
          GTEST_BRANCH: ${{ github.event.inputs.gtest_branch }}
          GTEST_RUN_NUMBER: ${{ github.event.inputs.gtest_run_number }}
          BASELINE_PYTEST_RUN_NUMBER: ${{ github.event.inputs.baseline_pytest_run_number }}
          BASELINE_GTEST_RUN_NUMBER: ${{ github.event.inputs.baseline_gtest_run_number }}
        with:
          script: return require(`${{ github.workspace }}/.github/scripts/ci/find-nightly-runs.js`)({ github, context, core })

      - name: Check if both workflows completed
        id: check-status
        env:
          GTEST_RUN_ID: ${{ steps.get-runs.outputs.gtest_run_id }}
          PYTEST_RUN_ID: ${{ steps.get-runs.outputs.pytest_run_id }}
        run: task ci:workflow -- both-workflows

  generate-combined-report:
    needs: wait-for-both-workflows
    if: needs.wait-for-both-workflows.outputs.both_completed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: 'preparation: Harden Runner'
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: 'preparation: Checkout MTL'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

      - name: Get pytest run metadata
        id: pytest-metadata
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ needs.wait-for-both-workflows.outputs.pytest_run_id }}
          RUN_LABEL: Pytest
        with:
          script: return require(`${{ github.workspace }}/.github/scripts/ci/workflow-run-metadata.js`)({ github, context, core })

      - name: Get gtest run metadata
        id: gtest-metadata
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ needs.wait-for-both-workflows.outputs.gtest_run_id }}
          RUN_LABEL: GTest
        with:
          script: return require(`${{ github.workspace }}/.github/scripts/ci/workflow-run-metadata.js`)({ github, context, core })

      - name: Download pytest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-test-report-*
          path: pytest-reports
          merge-multiple: false
          run-id: ${{ needs.wait-for-both-workflows.outputs.pytest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download gtest artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-gtest-report-*
          path: gtest-reports
          merge-multiple: false
          run-id: ${{ needs.wait-for-both-workflows.outputs.gtest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten pytest report structure
        run: task ci:report -- flatten-pytest

      - name: Flatten gtest report structure
        run: task ci:report -- flatten-gtest

      - name: Download system info artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: system-info-*
          path: system-info-reports
          merge-multiple: false
          run-id: ${{ needs.wait-for-both-workflows.outputs.pytest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Also download system info from gtest run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: system-info-*
          path: system-info-reports
          merge-multiple: false
          run-id: ${{ needs.wait-for-both-workflows.outputs.gtest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List downloaded system info
        run: task ci:report -- list-system-info

      - name: Download baseline pytest artifacts
        if: needs.wait-for-both-workflows.outputs.baseline_pytest_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: nightly-test-report-*
          path: baseline-pytest-reports
          merge-multiple: false
          run-id: ${{ needs.wait-for-both-workflows.outputs.baseline_pytest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download baseline gtest artifacts
        if: needs.wait-for-both-workflows.outputs.baseline_gtest_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: nightly-gtest-report-*
          path: baseline-gtest-reports
          merge-multiple: false
          run-id: ${{ needs.wait-for-both-workflows.outputs.baseline_gtest_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten baseline pytest report structure
        if: needs.wait-for-both-workflows.outputs.baseline_pytest_run_id != ''
        env:
          REPORT_DIR: baseline-pytest-reports
        run: task ci:report -- flatten-pytest

      - name: Flatten baseline gtest report structure
        if: needs.wait-for-both-workflows.outputs.baseline_gtest_run_id != ''
        env:
          REPORT_DIR: baseline-gtest-reports
        run: task ci:report -- flatten-gtest

      - name: Get baseline pytest run metadata
        id: baseline-pytest-metadata
        if: needs.wait-for-both-workflows.outputs.baseline_pytest_run_id != ''
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ needs.wait-for-both-workflows.outputs.baseline_pytest_run_id }}
          RUN_LABEL: Baseline Pytest
        with:
          script: return require(`${{ github.workspace }}/.github/scripts/ci/workflow-run-metadata.js`)({ github, context, core })

      - name: Get baseline gtest run metadata
        id: baseline-gtest-metadata
        if: needs.wait-for-both-workflows.outputs.baseline_gtest_run_id != ''
        uses: actions/github-script@v9
        env:
          RUN_ID: ${{ needs.wait-for-both-workflows.outputs.baseline_gtest_run_id }}
          RUN_LABEL: Baseline GTest
        with:
          script: return require(`${{ github.workspace }}/.github/scripts/ci/workflow-run-metadata.js`)({ github, context, core })

      - name: Install dependencies
        env:
          REPORT_REQUIRE_LXML: '1'
        run: task ci:report -- install-dependencies

      - name: Generate combined reports
        id: combine
        env:
          PYTEST_RUN_ID: ${{ steps.pytest-metadata.outputs.run_id }}
          PYTEST_RUN_DATE: ${{ steps.pytest-metadata.outputs.run_date }}
          PYTEST_RUN_NUMBER: ${{ steps.pytest-metadata.outputs.run_number }}
          PYTEST_BRANCH: ${{ steps.pytest-metadata.outputs.branch }}
          PYTEST_RUN_URL: ${{ steps.pytest-metadata.outputs.run_url }}
          GTEST_RUN_ID: ${{ steps.gtest-metadata.outputs.run_id }}
          GTEST_RUN_DATE: ${{ steps.gtest-metadata.outputs.run_date }}
          GTEST_RUN_NUMBER: ${{ steps.gtest-metadata.outputs.run_number }}
          GTEST_BRANCH: ${{ steps.gtest-metadata.outputs.branch }}
          GTEST_RUN_URL: ${{ steps.gtest-metadata.outputs.run_url }}
          BASELINE_PYTEST_RUN_ID: ${{ steps.baseline-pytest-metadata.outputs.run_id }}
          BASELINE_PYTEST_RUN_DATE: ${{ steps.baseline-pytest-metadata.outputs.run_date }}
          BASELINE_PYTEST_RUN_NUMBER: ${{ steps.baseline-pytest-metadata.outputs.run_number }}
          BASELINE_PYTEST_BRANCH: ${{ steps.baseline-pytest-metadata.outputs.branch }}
          BASELINE_PYTEST_RUN_URL: ${{ steps.baseline-pytest-metadata.outputs.run_url }}
          BASELINE_GTEST_RUN_ID: ${{ steps.baseline-gtest-metadata.outputs.run_id }}
          BASELINE_GTEST_RUN_DATE: ${{ steps.baseline-gtest-metadata.outputs.run_date }}
          BASELINE_GTEST_RUN_NUMBER: ${{ steps.baseline-gtest-metadata.outputs.run_number }}
          BASELINE_GTEST_BRANCH: ${{ steps.baseline-gtest-metadata.outputs.branch }}
          BASELINE_GTEST_RUN_URL: ${{ steps.baseline-gtest-metadata.outputs.run_url }}
        run: task ci:report -- combine-all

      - name: Upload combined Excel report
        if: steps.combine.outputs.reports_generated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-combined-report-excel
          path: combined_nightly_report.xlsx

      - name: Upload combined HTML report
        if: steps.combine.outputs.reports_generated == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-combined-report-html
          path: combined_nightly_report.html