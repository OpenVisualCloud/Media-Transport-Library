name: perf-pytest
on:
  workflow_dispatch:
    inputs:
      branch:
        description: MTL branch to build and test (defaults to workflow branch)
        required: false
        type: string
      marker:
        description: 'Pytest marker filter (-m), e.g. performance'
        required: false
        type: string
      test_filter:
        description: 'Pytest keyword filter (-k), e.g. test_rx[multi_core-59fps-1080p-dma]'
        required: false
        type: string
        default: '1080p and 59fps'
      num_sessions:
        description: Fixed session count (skip binary search)
        required: false
        type: string
      sch_quota:
        description: Scheduler session quota override
        required: false
        type: string
      test_time:
        description: Test duration in seconds
        required: false
        type: string
        default: '120'
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read

jobs:
  run-perf-tests:
    runs-on: [self-hosted, perf, sut]
    timeout-minutes: 720
    steps:
      - name: Harden-Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Set current date
        run: echo "CURRENT_DATE=$(date '+%y%m%d-%H%M%S')" >> "$GITHUB_ENV"
      - name: 'preparation: Clean workspace and checkout MTL'
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@497c4107ae027a4f9d6da088d027639df40064e3
        with:
          ref: '${{ inputs.branch || github.ref }}'
          fetch-depth: '0'
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      # Twice: the branch's own overlay-tests may be older than the workflow
      # commit's. The first run checks out the workflow commit's copy, the
      # second runs it.
      - name: Overlay test framework from workflow branch
        if: inputs.branch != ''
        env:
          MTL_SOURCE: ${{ inputs.branch }}
          TEST_SHA: ${{ github.sha }}
          TEST_REF: ${{ github.ref_name }}
        run: task ci:workflow -- overlay-tests && task ci:workflow -- overlay-tests
      - name: 'preparation: Validate host and download artifacts'
        id: validate
        uses: ./.github/actions/validate-host
        with:
          shadow_host: '/etc/mtl-ci/runner.env'
      - name: Ensure the acceptance virtualenv
        run: task ci:pytest-setup -- ensure
      - name: Set session ID
        env:
          RUNNER_NAME: ${{ runner.name }}
        run: task ci:pytest-setup -- session
      - name: Set PCI device
        run: task ci:pytest-setup -- pci-env
      - name: Generate pytest configuration files
        env:
          SESSION_ID: ${{ env.SESSION_ID }}
          PCI_DEVICE: ${{ env.PCI_DEVICE }}
          SHADOW_IP: ${{ steps.validate.outputs.shadow_host_ip }}
          SHADOW_USER: ${{ steps.validate.outputs.shadow_host_user }}
          TEST_TIME: ${{ inputs.test_time || '120' }}
        run: task ci:pytest-setup -- config-perf
      - name: Verify the perf media assets
        # A case whose source is absent skips, so without this a host that lost
        # the share -- or never got the 24-frame prefixes -- reports a green perf
        # leg having transmitted nothing.
        env:
          MEDIA_ASSET_SET: perf
        run: task ci:media-assets -- verify
      - name: Export workflow tag for PCAP naming
        run: echo "MTL_GITHUB_WORKFLOW=${{ github.workflow }}" >> "$GITHUB_ENV"
      - name: Run performance tests
        env:
          PYTEST_MARKER: ${{ inputs.marker }}
          PYTEST_FILTER: ${{ inputs.test_filter || '1080p and 59fps' }}
          NUM_SESSIONS: ${{ inputs.num_sessions }}
          SCH_QUOTA: ${{ inputs.sch_quota }}
        run: task ci:pytest-run -- performance
      - name: Generate performance report
        if: always()
        run: task ci:report -- performance
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "perf-test-report-${{ runner.name }}-${{ env.CURRENT_DATE }}"
          path: |
            ./tests/acceptance/report.html
            ./tests/acceptance/performance_report.html
            ./tests/acceptance/perf-logs.tar.gz
      - name: Clean up
        if: always()
        uses: ./.github/actions/cleanup
