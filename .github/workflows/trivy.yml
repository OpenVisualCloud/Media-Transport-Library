name: Trivy

on:
  schedule:
    - cron: "0 0 * * 6"
  pull_request:
    branches:
      - main
      - 'maint-**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch to run scans on (empty: the branch the workflow runs from)'
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Mirrors of the same database. Trivy tries the next one when a source is rate limited
  # or answers with a server error.
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      trivy: ${{ github.event_name != 'pull_request' || steps.filter.outputs.trivy == 'true' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: .github/path_filters.yml

  trivy:
    name: config scan (${{ matrix.target }})
    needs: changes
    if: ${{ needs.changes.outputs.trivy == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        target: [docker, manager]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ inputs.branch }}

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ./${{ matrix.target }}
          format: sarif
          exit-code: 1
          output: Trivy-${{ matrix.target }}.sarif

      # The upload must also run when the scan finds an issue and fails the step
      - name: Upload Trivy scan results to GitHub Security tab
        if: ${{ !cancelled() && hashFiles(format('Trivy-{0}.sarif', matrix.target)) != '' }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: Trivy-${{ matrix.target }}.sarif
          category: trivy-config-${{ matrix.target }}

  sbom:
    name: spdx sbom and vulnerability scan
    # The SBOM reads the dependency files of the whole tree, not the Dockerfiles.
    # On a pull request, dependency-review.yml checks the dependency files that change.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 3
        with:
          ref: ${{ inputs.branch }}

      - name: Run Trivy to generate SPDX JSON SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          cache: false
          format: spdx-json
          output: Trivy-sbom.spdx.json
        env:
          # Trivy only reads files named exactly requirements.txt by default
          TRIVY_FILE_PATTERNS: 'pip:(^|/)requirements-[^/]*\.txt$'

      # trivy fs writes downloadLocation "git+." for a checkout, which is not valid SPDX
      - name: Set SBOM download locations
        run: |
          location="git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@$(git rev-parse HEAD)"
          jq --arg location "$location" '
            (.packages[] | select(.downloadLocation == "git+.") | .downloadLocation) = "NOASSERTION"
            | (.packages[] | select(.primaryPackagePurpose == "SOURCE") | .downloadLocation) = $location
          ' Trivy-sbom.spdx.json > Trivy-sbom.spdx.json.tmp
          mv Trivy-sbom.spdx.json.tmp Trivy-sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sbom-spdx
          path: Trivy-sbom.spdx.json

      - name: Run Trivy vulnerability scanner on the SBOM with json output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: Trivy-sbom.spdx.json
          cache: false
          format: json
          exit-code: 0
          output: Trivy-sbom-vulnerabilities.json

      - name: Upload vulnerability report as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sbom-vulnerabilities
          path: Trivy-sbom-vulnerabilities.json

      # The trivy-action steps above put trivy on PATH
      - name: Fail on CRITICAL or HIGH vulnerabilities in the SBOM
        run: trivy convert --format table --severity CRITICAL,HIGH --exit-code 1 Trivy-sbom-vulnerabilities.json

  # A separate job, so that the trivy steps never hold a token that can write
  release-sbom:
    name: attach sbom to the release
    needs: sbom
    # The release gets its SBOM also when the SBOM has CRITICAL or HIGH vulnerabilities
    if: ${{ github.event_name == 'release' && !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write # for gh release upload
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: trivy-sbom-spdx

      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mv Trivy-sbom.spdx.json "Media-Transport-Library-${TAG}.spdx.json"
          gh release upload "$TAG" "Media-Transport-Library-${TAG}.spdx.json" --repo "$GITHUB_REPOSITORY" --clobber
