name: Trivy

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 23 * * *"
  pull_request:
    branches:
      - main
      - 'maint-**'
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch to run scans on (empty: the branch the workflow runs from)'
        default: ''
        type: string


env:
  BUILD_TYPE: Release
  MTL_BUILD_DISABLE_PCAPNG: true
  PREFIX_DIR: /usr/local
  DEBIAN_FRONTEND: noninteractive
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db
permissions:
  contents: read


jobs:
  triv-security-tab:
    name: sarif output scan
    runs-on: ubuntu-22.04
    permissions:
        security-events: write  # for github/codeql-action/upload-sarif to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        if: github.event_name == 'schedule' && github.event.schedule == '0 23 * * *'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: maint-25.02 # tmp branch
      - name: Checkout code
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Checkout code
        if: github.event_name != 'schedule'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}


      - name: Run Trivy vulnerability scanner with sarif output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ./docker
          format: sarif
          exit-code: 0
          vuln-type: os,library
          output: Trivy-dockerfile.sarif

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-dockerfile-sarif
          path: Trivy-dockerfile.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: Trivy-dockerfile.sarif

  triv-security-tab-manager:
    name: manager sarif output scan
    runs-on: ubuntu-22.04
    permissions:
        security-events: write  # for github/codeql-action/upload-sarif to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        if: github.event_name == 'schedule' && github.event.schedule == '0 23 * * *'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: maint-25.02 # tmp branch
      - name: Checkout code
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Checkout code
        if: github.event_name != 'schedule'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}

      - name: Run Trivy vulnerability scanner with sarif output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ./manager
          format: sarif
          exit-code: 0
          vuln-type: os,library
          output: Trivy-manager-dockerfile.sarif

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-manager-dockerfile-sarif
          path: Trivy-manager-dockerfile.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: Trivy-manager-dockerfile.sarif

  trivy-sbom:
    name: spdx sbom and vulnerability scan
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        if: github.event_name == 'schedule' && github.event.schedule == '0 23 * * *'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: maint-25.02 # tmp branch
      - name: Checkout code
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Checkout code
        if: github.event_name != 'schedule'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}

      - name: Run Trivy to generate SPDX JSON SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          cache: false
          format: spdx-json
          output: Trivy-sbom.spdx.json
        env:
          # Trivy only reads files named exactly requirements.txt by default
          TRIVY_FILE_PATTERNS: 'pip:(^|/)requirements-[^/]*\.txt$'

      # trivy fs writes downloadLocation "git+." for a checkout, which is not valid SPDX
      - name: Set SBOM download locations
        run: |
          location="git+${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}@$(git rev-parse HEAD)"
          jq --arg location "$location" '
            (.packages[] | select(.downloadLocation == "git+.") | .downloadLocation) = "NOASSERTION"
            | (.packages[] | select(.primaryPackagePurpose == "SOURCE") | .downloadLocation) = $location
          ' Trivy-sbom.spdx.json > Trivy-sbom.spdx.json.tmp
          mv Trivy-sbom.spdx.json.tmp Trivy-sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sbom-spdx
          path: Trivy-sbom.spdx.json

      - name: Run Trivy vulnerability scanner on the SBOM with json output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: Trivy-sbom.spdx.json
          cache: false
          format: json
          exit-code: 0
          output: Trivy-sbom-vulnerabilities.json

      - name: Upload vulnerability report as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-sbom-vulnerabilities
          path: Trivy-sbom-vulnerabilities.json

      - name: Fail on CRITICAL or HIGH vulnerabilities in the SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: sbom
          scan-ref: Trivy-sbom.spdx.json
          cache: false
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1

  trivy-stdout:
    name: table output scan
    runs-on: ubuntu-22.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        if: github.event_name == 'schedule' && github.event.schedule == '0 23 * * *'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: maint-25.02 # tmp branch
      - name: Checkout code
        if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * *'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Checkout code
        if: github.event_name != 'schedule'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.branch }}

      - name: Run Trivy vulnerability scanner with table output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ./docker
          cache: false
          format: table
          exit-code: 1
          vuln-type: os,library

      - name: Run Trivy manager vulnerability scanner with table output
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ./manager
          cache: false
          format: table
          exit-code: 1
          vuln-type: os,library
