name: Windows MSYS2 build

on:
  # allow manually trigger
  workflow_dispatch:

env:
  # FIXME: For some reason enabling jit debugging "fixes" random python crashes
  # see https://github.com/msys2/MINGW-packages/issues/11864 and
  # https://gitlab.gnome.org/GNOME/glib/-/merge_requests/3280#note_1678973
  MSYS: winjitdebug

permissions:
  contents: read

jobs:
  # The workflow has only a manual trigger, so there is no change to filter.
  # Give it a filter in .github/path_filters.yml when it gets a push or a
  # pull_request trigger.
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        sys:
          - mingw64
          - ucrt64
        dpdk: [25.03, 23.11]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Install dependencies
        uses: msys2/setup-msys2@7efe20baefed56359985e327d329042cde2434ff # v2
        with:
          msystem: ${{ matrix.sys }}
          update: true
          install: >-
            git
            base-devel
            unzip
          pacboy: >-
            pkgconf:p
            openssl:p
            gcc:p
            meson:p
            json-c:p
            libpcap:p
            gtest:p
            SDL2:p
            SDL2_ttf:p
            dlfcn:p

      - name: Checkout IMTL code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

      - name: Install npcap-sdk
        run: task ci:msys-install-npcap

      - name: Checkout mman-win32 code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'alitrack/mman-win32'
          ref: master
          path: mman-win32

      - name: Build and install mman-win32
        run: task ci:msys-install-mman

      - name: Convert patches for DPDK
        run: task ci:msys-prepare-dpdk-patches DPDK_VERSION=${{ matrix.dpdk }}

      - name: Hash DPDK patches
        id: hash-patches
        working-directory: patches/dpdk/${{ matrix.dpdk }}
        run: echo "hash=$(sha1sum ./*.patch windows/*.patch | sha1sum | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Cache DPDK
        id: cache-dpdk
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: dpdk
          key: dpdk-${{ matrix.dpdk }}-${{ matrix.sys }}-${{ steps.hash-patches.outputs.hash }}

      - name: Checkout DPDK code
        if: ${{ steps.cache-dpdk.outputs.cache-hit != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'DPDK/dpdk'
          ref: v${{matrix.dpdk}}
          path: dpdk
          clean: true

      - name: Apply patches for DPDK
        if: ${{ steps.cache-dpdk.outputs.cache-hit != 'true' }}
        shell: bash
        run: task ci:msys-apply-dpdk-patches DPDK_VERSION=${{ matrix.dpdk }}

      - name: Build and install DPDK
        if: ${{ steps.cache-dpdk.outputs.cache-hit != 'true' }}
        working-directory: dpdk
        run: |
          meson setup build -Dplatform=generic
          meson install -C build

      - name: Install cached DPDK
        if: ${{ steps.cache-dpdk.outputs.cache-hit == 'true' }}
        run: meson install -C dpdk/build --no-rebuild

      - name: Build
        run: ./build.sh

      - name: Build with debug
        run: |
          rm -rf build
          ./build.sh debugonly

      - name: Build with TAP
        run: |
          meson setup tap_build -Denable_tap=true
          meson install -C tap_build
