name: PR Gate

# Shared entry gate for the bare-metal test workflows. smoke-tests and
# gtest-bare-metal both opened with the same two jobs -- decide whether the
# change touches anything testable, then wait for the Build workflow that
# produces the artifacts they consume. Keeping one copy means the two cannot
# drift apart, which is how the filters and the check name they wait for
# stopped matching in the first place.

on:
  workflow_call:
    inputs:
      wait_for_build:
        description: Wait for the Build workflow to publish its artifacts.
        type: boolean
        required: false
        default: true
    outputs:
      changed:
        description: Whether the change touches code these tests cover.
        value: ${{ jobs.check-for-changes.outputs.changed }}

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  check-for-changes:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.filter.outputs.linux_tests == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Clean workspace and checkout
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@2f540b33d05ab93541c816182b791c0fb6b5d143

      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: .github/path_filters.yml

  wait-for-build:
    needs: check-for-changes
    runs-on: ubuntu-latest
    # Long enough to sit out the queue in front of the build host. The build job
    # runs on a single shared bare-metal runner, so the wait is dominated by
    # whatever else the fleet is doing, not by the build: a 20-minute cap failed
    # this gate on commits whose build had not started yet, which then reads as a
    # test failure on a change that was never tested. The action bounds all three
    # waiting states itself -- in_progress, never-created, and queued -- so this
    # cap is only the backstop behind them, five minutes past the longest.
    timeout-minutes: 75
    steps:
      - name: Harden Runner
        if: ${{ needs.check-for-changes.outputs.changed == 'true' && github.event_name != 'workflow_dispatch' }}
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Wait for Build workflow
        if: ${{ inputs.wait_for_build && needs.check-for-changes.outputs.changed == 'true' && github.event_name != 'workflow_dispatch' }}
        uses: ./.github/actions/wait-for-workflow
        with:
          check_name: build
          # Without this the gate also accepts the `build` job of GitHub's Pages
          # deployment run, which finishes minutes before the real build.
          workflow: build.yml
          # Five minutes inside this job's timeout-minutes, so the wait ends with
          # "no runner ever picked the build up" instead of a bare job timeout.
          queue_timeout: '4200'
