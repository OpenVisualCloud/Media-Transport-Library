name: gtest-bare-metal

on:
  # allow manually trigger
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        type: string
        default: 'main'
        required: false
        description: 'Branch name to use'
  push:
    branches:
      - main
      - 'maint-**'
  pull_request:
    branches:
      - main
      - 'maint-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  pr-gate:
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read

  run-gtest-tests:
    needs: pr-gate
    strategy:
      matrix:
        nic:
          - e810
          - e830
          - e835
      fail-fast: false
    runs-on: ${{ matrix.nic }}
    steps:
      - name: Harden Runner
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout MTL
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@main
        with:
          ref: '${{ inputs.branch-to-checkout || github.sha || github.ref }}'

      - name: Validate host and download artifacts
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        uses: ./.github/actions/validate-host

      - name: Check and build ice driver if needed
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        run: |
          if ! sudo modinfo ice | grep -Ei '^version:[[:space:]]*Kahawai_'; then ./script/build_ice_driver.sh; fi

      - name: 'cleanup: Kill stale processes before test'
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        uses: ./.github/actions/cleanup

      - name: Run gtest bare metal
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        env:
          NIGHTLY: 0
          EXIT_ON_FAILURE: 1
        run: sudo -E "${{ github.workspace }}/.github/scripts/gtest.sh"

      - name: 'cleanup: Kill test processes'
        if: always()
        uses: ./.github/actions/cleanup
