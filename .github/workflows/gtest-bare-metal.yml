name: gtest-bare-metal

on:
  # allow manually trigger
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        type: string
        default: 'main'
        required: false
        description: 'Branch name to use'
  push:
    branches:
      - main
      - 'maint-**'
  pull_request:
    branches:
      - main
      - 'maint-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  pr-gate:
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read

  run-gtest-tests:
    needs: pr-gate
    strategy:
      matrix:
        nic:
          - e810
          - e830
          - e835
      fail-fast: false
    runs-on: ${{ matrix.nic }}
    # Healthy legs finish in under 20 minutes. Without a bound, one wedged ICE
    # driver load holds a fleet runner for GitHub's 360-minute default and the
    # always() cleanup step never releases the NIC.
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout MTL
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@2f540b33d05ab93541c816182b791c0fb6b5d143
        with:
          ref: '${{ inputs.branch-to-checkout || github.sha || github.ref }}'

      - name: Validate host and download artifacts
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        uses: ./.github/actions/validate-host
        with:
          nic: ${{ matrix.nic }}

      - name: 'cleanup: Kill stale processes before test'
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        uses: ./.github/actions/cleanup

      # sudo -E carries the whole environment across, BASH_XTRACEFD included, and
      # that variable names a file descriptor of the shell that set it. In the
      # privileged shell the descriptor is closed, so every step below used to
      # open with `bash: BASH_XTRACEFD: 19: invalid value for trace file
      # descriptor` -- a line that reads like the start of a failure and is not
      # one. Dropping the variable is the whole fix; nothing here traces.
      - name: Bind the test ports
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        run: sudo -E env -u BASH_XTRACEFD "$TASK_BIN" ci:bind-test-ports

      - name: Run gtest bare metal
        if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
        env:
          NIGHTLY: 0
          EXIT_ON_FAILURE: 1
        run: sudo -E env -u BASH_XTRACEFD "${{ github.workspace }}/.github/scripts/gtest.sh"

      - name: 'cleanup: Kill test processes'
        if: always()
        uses: ./.github/actions/cleanup
