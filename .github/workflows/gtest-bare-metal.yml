name: gtest-bare-metal

on:
  # allow manually trigger
  workflow_dispatch:
    inputs:
      branch-to-checkout:
        type: string
        default: 'main'
        required: false
        description: 'Branch name to use'
  push:
    branches:
      - main
      - 'maint-**'
  pull_request:
    branches:
      - main
      - 'maint-**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  pr-gate:
    uses: ./.github/workflows/pr-gate.yml
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    with:
      filter: gtest

  run-gtest-tests:
    needs: pr-gate
    # Gate the job, not its steps: a leg with nothing to test must not take a
    # fleet NIC host. gtest-result below is the check to require.
    if: ${{ needs.pr-gate.outputs.changed == 'true' && github.repository == 'OpenVisualCloud/Media-Transport-Library' }}
    strategy:
      matrix:
        nic:
          - e810
          - e830
          - e835
      fail-fast: false
    runs-on: ${{ matrix.nic }}
    # Healthy legs finish in under 20 minutes. Without a bound, one wedged ICE
    # driver load holds a fleet runner for GitHub's 360-minute default and the
    # always() cleanup step never releases the NIC.
    timeout-minutes: 45
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout MTL
        uses: OpenVisualCloud/Media-Transport-Library/.github/actions/checkout-clean@497c4107ae027a4f9d6da088d027639df40064e3
        with:
          ref: '${{ inputs.branch-to-checkout || github.sha || github.ref }}'

      - name: Validate host and download artifacts
        uses: ./.github/actions/validate-host
        with:
          nic: ${{ matrix.nic }}

      - name: Run gtest bare metal
        env:
          NIGHTLY: 0
          EXIT_ON_FAILURE: 1
        run: sudo -E env -u BASH_XTRACEFD "${{ github.workspace }}/.github/scripts/gtest.sh"

      - name: 'cleanup: Kill test processes'
        if: always()
        run: task cleanup

  # The one check to require in branch protection. A skipped matrix job
  # publishes no per-leg check name, so a required "run-gtest-tests (e810)"
  # stays pending when the path filter skips the legs. This job always runs,
  # and fails only if the gate or a leg failed or was cancelled.
  gtest-result:
    name: gtest-result
    needs: [pr-gate, run-gtest-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All gtest legs ok
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: exit 0
      - name: Some gtest legs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
