# This is used by the action https://github.com/dorny/paths-filter
#
# One filter per job that it gates, named after that job. A filter lists the
# paths that the job reads, so a change runs only the jobs it can affect. A
# directory glob is used where a script in it can source a sibling script.
# dorny ignores a '!' pattern with the default predicate, so do not exclude
# paths: list the paths to include.
#
# .github/scripts/ci/check-path-filters.py (a checkpatch hook) enforces the
# rules below. Run it after each change to this file.
#
#   - hash_<name> holds the paths of script/hash_sources_<name>.env, one to one
#     (a directory "dir/" becomes 'dir/**'). A change to one of these paths
#     gives the Build workflow a new artifact.
#   - Each filter that a workflow reads exists, and each pattern matches a
#     tracked file.
#   - build_workflow holds each filter that pr-gate.yml gets, because the tests
#     wait for the Build workflow. If Build skips, the wait times out.
#   - A filter names each file of script/ that its job runs. A glob such as
#     'script/**' runs the job for a change to a script that it never calls.
#   - scripts holds each script/*.sh and .github/scripts/setup_environment.sh,
#     because test-scripts.sh checks each of them.

# ---------------------------------------------------------------- Artifacts
# script/hash_sources.sh chains the hashes: dpdk -> mtl -> jpegxs -> ffmpeg,
# and mtl -> gstreamer, mtl -> plugins. ice stands alone.

hash_dpdk: &hash_dpdk
  - .github/scripts/setup_environment.sh
  - script/install_dependencies.sh
  - .github/scripts/ci/build-dependencies.sh
  - script/hash_sources_dpdk.env
  - 'patches/dpdk/**'
  - versions.env
  - script/build_dpdk.sh
  - script/common.sh

hash_mtl: &hash_mtl
  - .github/scripts/setup_environment.sh
  - script/install_dependencies.sh
  - build.sh
  - script/hash_sources_mtl.env
  - meson.build
  - meson_options.txt
  - 'lib/**'
  - 'include/**'
  - versions.env
  - plugins/meson.build
  - plugins/meson_options.txt
  - plugins/log.h
  - plugins/plugin_platform.h
  - 'plugins/sample/**'
  - 'ld_preload/**'
  - 'manager/**'
  - VERSION
  - 'tests/tools/RxTxApp/**'
  - 'app/**'
  - 'tests/integration_tests/**'
  - tests/meson.build
  - tests/meson_options.txt

hash_jpegxs: &hash_jpegxs
  - .github/scripts/ci/build-jpegxs.sh
  - .github/scripts/ci/validate-jpegxs.sh
  - .github/scripts/setup_environment.sh
  - script/install_dependencies.sh
  - ecosystem/ffmpeg_plugin/build.sh
  - script/hash_sources.sh
  - script/hash_sources_jpegxs.env
  - versions.env

hash_ice: &hash_ice
  - .github/scripts/ci/build-dependencies.sh
  - .github/scripts/ci/validate-ice.sh
  - .github/scripts/setup_environment.sh
  - script/install_dependencies.sh
  - 'patches/ice_drv/**'
  - script/build_drivers.sh
  - script/common.sh
  - script/hash_sources_ice.env
  - versions.env

hash_ffmpeg: &hash_ffmpeg
  - .github/scripts/setup_environment.sh
  - script/install_dependencies.sh
  - script/hash_sources_ffmpeg.env
  - 'ecosystem/ffmpeg_plugin/**'
  - versions.env

hash_gstreamer: &hash_gstreamer
  - .github/scripts/setup_environment.sh
  - script/install_dependencies.sh
  - script/hash_sources_gstreamer.env
  - 'ecosystem/gstreamer_plugin/**'
  - 'tests/tools/gstreamer_tools/**'

hash_plugins: &hash_plugins
  - .github/scripts/setup_environment.sh
  - script/install_dependencies.sh
  - script/hash_sources_plugins.env
  - script/build_st22_avcodec_plugin.sh
  - script/common.sh
  - 'plugins/st22_avcodec/**'
  - VERSION

hash_sources: &hash_sources
  - *hash_dpdk
  - *hash_mtl
  - *hash_jpegxs
  - *hash_ice
  - *hash_ffmpeg
  - *hash_gstreamer
  - *hash_plugins

# ------------------------------------------------------- Shared parts of jobs

# The root meson project: libmtl and its public headers.
libmtl: &libmtl
  - build.sh
  - meson.build
  - meson_options.txt
  - VERSION
  - 'include/**'
  - 'lib/**'

# The unit suite. tests/unit/ffmpeg compiles these two plugin files.
unit_sources: &unit_sources
  - 'tests/unit/**'
  - ecosystem/ffmpeg_plugin/mtl_common.c
  - ecosystem/ffmpeg_plugin/mtl_common.h

# What a bare-metal test job runs besides the artifacts: the gate, the host
# setup actions, the ci:* tasks and the scripts that they call. checkout-clean
# is not here: the workflows use it at a pinned commit, not from this tree.
# .github/path_filters.yml is not here: check-path-filters.py checks it, and a
# run on the NIC hosts does not. Each file of script/ is named: gtest.sh,
# bind-test-ports.sh and tests/acceptance call nicctl.sh, the validate-host
# action and ci:validate-dependencies call build_ebpf_xdp.sh, and
# source-checksums calls hash_sources.sh.
bare_metal_ci: &bare_metal_ci
  - .github/workflows/pr-gate.yml
  - .github/workflows/build.yml
  - .github/workflows/kahawai_template.json
  - '.github/actions/validate-host/**'
  - '.github/actions/cleanup/**'
  - '.github/actions/source-checksums/**'
  - '.github/actions/wait-for-workflow/**'
  - '.github/scripts/ci/**'
  - Taskfile.yml
  - script/common.sh
  - script/nicctl.sh
  - script/build_ebpf_xdp.sh
  - script/hash_sources.sh

# ------------------------------------------------------------ Filters (jobs)

# gtest-bare-metal.yml. KahawaiTest loads the sample, JPEG XS and st22 avcodec
# plugins through the plugin registry, and the host loads the cached ICE
# module. It does not use MtlManager, RxTxApp, ld_preload or the GStreamer
# plugin. The st22 avcodec plugin links the FFmpeg cache, but gtest.sh does not
# put .local_install/ffmpeg on the library path of KahawaiTest, so a change to
# FFmpeg does not reach it.
gtest: &gtest
  - *hash_dpdk
  - *libmtl
  - .github/scripts/setup_environment.sh
  - script/install_dependencies.sh
  - versions.env
  - plugins/meson.build
  - plugins/meson_options.txt
  - plugins/log.h
  - plugins/plugin_platform.h
  - 'plugins/sample/**'
  - tests/meson.build
  - tests/meson_options.txt
  - 'tests/integration_tests/**'
  - *hash_ice
  - *hash_jpegxs
  - *hash_plugins
  - *bare_metal_ci
  - .github/workflows/gtest-bare-metal.yml
  - .github/scripts/gtest.sh

# smoke-tests.yml. The job restores all artifacts and fails if one is missing.
# pytest collects all of tests/acceptance, and the markers are in the test
# files, so the whole tree applies.
smoke_tests: &smoke_tests
  - *hash_sources
  - *bare_metal_ci
  - .github/workflows/smoke-tests.yml
  - .github/scripts/lib/mtl_acceptance_venv.sh
  - 'tests/acceptance/**'

# build.yml: the artifacts, and each filter that waits for them. A test-only
# change also runs Build: all of its caches hit, and it restores a cache that
# GitHub evicted, which a skipped build cannot do.
build_workflow:
  - *hash_sources
  - *gtest
  - *smoke_tests

# unit_tests.yml. It builds DPDK, then runs ./build.sh unit, which builds only
# the root meson project.
unit_tests:
  - .github/path_filters.yml
  - .github/workflows/unit_tests.yml
  - *hash_dpdk
  - *libmtl
  - *unit_sources

# fuzz_tests.yml. It builds DPDK, then fuzz.sh builds the root meson project
# with the fuzz targets; fuzz.sh calls meson, not build.sh. Each harness
# includes a production .c file and links libmtl, and that file calls other
# files of libmtl, so each file of libmtl can change a target.
fuzz_tests:
  - .github/path_filters.yml
  - .github/workflows/fuzz_tests.yml
  - .github/scripts/ci/fuzz.sh
  - Taskfile.yml
  - *hash_dpdk
  - meson.build
  - meson_options.txt
  - VERSION
  - 'include/**'
  - 'lib/**'
  - 'tests/fuzz/**'

# base_build.yml: release, eBPF/XDP, and release with fuzzing (clang).
# setup_environment.sh builds DPDK, MTL, GPU Direct, the FFmpeg, GStreamer and
# OBS plugins, the Python and Rust bindings, and the tools. It does not build
# JPEG XS or st22 avcodec.
base_build:
  - .github/path_filters.yml
  - .github/workflows/base_build.yml
  - *hash_dpdk
  - *hash_mtl
  - *hash_ffmpeg
  - *hash_gstreamer
  - script/build_ebpf_xdp.sh
  - 'tests/fuzz/**'
  - 'gpu_direct/**'
  - 'ecosystem/obs_mtl/linux-mtl/**'
  - 'python/swig/**'
  - 'rust/**'
  - 'tools/ebpf/**'
  - 'tools/readpcap/**'
  - 'tools/sch_smi_emulate/**'

# docker_build.yml, ubuntu-docker-build. The build context is the repository
# root less .dockerignore, which drops .github/, so the hash_<name> filters do
# not apply: they hold .github/scripts/setup_environment.sh. Each image builds
# DPDK and the eBPF/XDP libraries with the scripts named below, and runs
# build.sh and the unit suite. The image also holds a copy of script/, but the
# job runs no other script, so a change to one does not run the job.
docker_build:
  - .github/path_filters.yml
  - .github/workflows/docker_build.yml
  - 'docker/*.dockerfile'
  - .dockerignore
  - script/common.sh
  - script/build_dpdk.sh
  - script/build_ebpf_xdp.sh
  - 'patches/dpdk/**'
  - versions.env
  - *libmtl
  - 'app/**'
  - plugins/meson.build
  - plugins/meson_options.txt
  - plugins/log.h
  - plugins/plugin_platform.h
  - 'plugins/sample/**'
  - 'ld_preload/**'
  - 'manager/**'
  - tests/meson.build
  - tests/meson_options.txt
  - 'tests/integration_tests/**'
  - 'tests/tools/RxTxApp/**'
  - *unit_sources

# unit_tests.yml, script-tests. test-scripts.sh checks the common structure of
# each script, and runs the scripts that need no NIC and no root.
scripts:
  - .github/path_filters.yml
  - .github/workflows/unit_tests.yml
  - .github/scripts/ci/test-scripts.sh
  - .github/scripts/setup_environment.sh
  - versions.env
  - 'patches/dpdk/**'
  - script/build_app.sh
  - script/build_dpdk.sh
  - script/build_drivers.sh
  - script/build_ebpf_xdp.sh
  - script/build_obs_plugin.sh
  - script/build_python.sh
  - script/build_st22_avcodec_plugin.sh
  - script/check_dpdk_patches.sh
  - script/common.sh
  - script/dos2unix.sh
  - script/hash_sources.sh
  - script/if_filter_delete.sh
  - script/install_dependencies.sh
  - script/isolation_monitor.sh
  - script/isolation_report.sh
  - script/lcore_stat_dump.sh
  - script/nicctl.sh
  - script/status_report.sh

# docker_build.yml, manager-docker-build. The build context is manager/.
manager_build:
  - .github/path_filters.yml
  - .github/workflows/docker_build.yml
  - 'manager/**'
  - VERSION

# docker_build.yml, compose-validate. It parses the compose files only.
docker_compose:
  - .github/path_filters.yml
  - .github/workflows/docker_build.yml
  - docker/docker-compose.yml
  - docker/docker-compose.xdp.yml
