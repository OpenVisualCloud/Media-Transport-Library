name: Run gtest
description: >-
  Run the bare-metal gtest harness on a host that validate-host prepared, then
  stop the test processes. The nightly mode runs every case, keeps going after a
  failure, and uploads the log and the system status.

inputs:
  nic:
    description: NIC label of the runner, the runs-on of the job.
    required: true
  nightly:
    description: Run the nightly case list and upload the reports.
    required: false
    default: 'false'
  gtest_cases:
    description: Regex of the gtest.sh case names to run (empty = all). Nightly only.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # env -u BASH_XTRACEFD: the descriptor the variable names does not exist in
    # the privileged shell.
    - name: Run gtest bare metal
      if: inputs.nightly != 'true'
      shell: bash
      env:
        NIGHTLY: 0
        EXIT_ON_FAILURE: 1
      run: sudo -E env -u BASH_XTRACEFD "${GITHUB_WORKSPACE}/.github/scripts/gtest.sh"

    - name: Run nightly gtest bare metal
      if: inputs.nightly == 'true'
      shell: bash
      env:
        NIGHTLY: 1
        GTEST_CASES: ${{ inputs.gtest_cases }}
        EXIT_ON_FAILURE: 0
        LOG_FILE: ${{ github.workspace }}/gtest.log
        TEST_CASE_TIMEOUT: 1800
      run: task ci:gtest-nightly

    - name: 'cleanup: Kill test processes'
      if: always()
      shell: bash
      run: task cleanup

    - name: 'collect: System status report'
      if: always() && inputs.nightly == 'true'
      shell: bash
      env:
        STATUS_NAME: system-info-${{ inputs.nic }}
      run: task ci:report -- status

    - name: Upload the gtest report
      if: always() && inputs.nightly == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nightly-gtest-report-${{ inputs.nic }}
        path: gtest.log

    - name: Upload the system info
      if: always() && inputs.nightly == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: system-info-${{ inputs.nic }}
        path: system-info-${{ inputs.nic }}/
