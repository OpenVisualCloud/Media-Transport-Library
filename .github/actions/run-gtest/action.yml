name: Run gtest
description: >-
  Run the bare-metal gtest harness on a host that validate-host prepared, then
  stop the test processes. The nightly mode runs a profile group (or regex
  filter), keeps going after failures, and uploads structured results.jsonl,
  summary.json, gtest.log, and system status.

inputs:
  nic:
    description: NIC label of the runner, the runs-on of the job.
    required: true
  nightly:
    description: Run the nightly case list and upload the reports.
    required: false
    default: 'false'
  gtest_group:
    description: Profile group name from tests/integration_tests/profiles.yaml. Nightly only.
    required: false
    default: ''
  gtest_cases:
    description: Regex of the profile names to run (empty = all in group). Nightly only.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # env -u BASH_XTRACEFD: the descriptor the variable names does not exist in
    # the privileged shell.
    - name: Run gtest bare metal
      if: inputs.nightly != 'true'
      shell: bash
      env:
        NIGHTLY: 0
        EXIT_ON_FAILURE: 1
        MTL_NIC_LABEL: ${{ inputs.nic }}
        GTEST_OUT_DIR: ${{ github.workspace }}/gtest-results
      run: sudo -E env -u BASH_XTRACEFD "${GITHUB_WORKSPACE}/.github/scripts/gtest.sh"

    - name: Run nightly gtest bare metal
      if: inputs.nightly == 'true'
      shell: bash
      env:
        NIGHTLY: 1
        MTL_NIC_LABEL: ${{ inputs.nic }}
        GTEST_GROUP: ${{ inputs.gtest_group }}
        GTEST_CASES: ${{ inputs.gtest_cases }}
        EXIT_ON_FAILURE: 0
        GTEST_OUT_DIR: ${{ github.workspace }}/gtest-results
        LOG_FILE: ${{ github.workspace }}/gtest-results/gtest.log
        TEST_CASE_TIMEOUT: 1800
      run: task ci:gtest-nightly

    - name: 'cleanup: Kill test processes'
      if: always()
      shell: bash
      run: task cleanup

    - name: 'collect: System status report'
      if: always() && inputs.nightly == 'true'
      shell: bash
      env:
        STATUS_NAME: system-info-${{ inputs.nic }}${{ inputs.gtest_group && format('-{0}', inputs.gtest_group) || '' }}
      run: task ci:report -- status

    - name: Upload the gtest report
      if: always() && inputs.nightly == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nightly-gtest-report-${{ inputs.nic }}${{ inputs.gtest_group && format('-{0}', inputs.gtest_group) || '' }}
        path: |
          gtest-results/results.jsonl
          gtest-results/summary.json
          gtest-results/gtest.log
        if-no-files-found: warn

    - name: Upload the system info
      if: always() && inputs.nightly == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: system-info-${{ inputs.nic }}${{ inputs.gtest_group && format('-{0}', inputs.gtest_group) || '' }}
        path: system-info-${{ inputs.nic }}${{ inputs.gtest_group && format('-{0}', inputs.gtest_group) || '' }}/
