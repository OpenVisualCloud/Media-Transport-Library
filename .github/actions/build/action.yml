name: Build
description: Build MTL and its ecosystem components. Optionally build on a remote host via SSH.
inputs:
  remote_host:
    description: 'SSH destination (user@host) for remote build. Skipped if empty.'
    required: false
    default: ''
  remote_mtl_path:
    description: 'MTL repo path on the remote host'
    required: false
    default: ''
  remote_branch:
    description: 'Branch to checkout on the remote host'
    required: false
    default: ''
  remote_env_file:
    description: 'Build env file on the runner to forward to remote host'
    required: false
    default: '~/.mtl_build_env'
runs:
  using: composite
  steps:
    - name: Install Task
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
    - name: Cleanup processes
      shell: bash
      run: task cleanup
    - name: Setup environment and build
      shell: bash
      env:
        SETUP_BUILD_AND_INSTALL_DPDK: '0'
        SETUP_BUILD_AND_INSTALL_ICE_DRIVER: '0'
        SETUP_BUILD_AND_INSTALL_EBPF_XDP: '0'
        SETUP_BUILD_AND_INSTALL_GPU_DIRECT: '0'
        MTL_BUILD_AND_INSTALL: '1'
        ECOSYSTEM_BUILD_AND_INSTALL_FFMPEG_PLUGIN: '1'
        ECOSYSTEM_BUILD_AND_INSTALL_GSTREAMER_PLUGIN: '1'
        TOOLS_BUILD_AND_INSTALL_SET_TAI_OFFSET: '1'
        # Capture PHC is disciplined to TAI at runtime via phc2sys -O
        # <live_offset>, so the kernel TAI offset is left untouched.
        TOOLS_RUN_SET_TAI_OFFSET: '0'
        REMOTE_HOST: ${{ inputs.remote_host }}
        REMOTE_MTL_PATH: ${{ inputs.remote_mtl_path }}
        REMOTE_BRANCH: ${{ inputs.remote_branch }}
        REMOTE_ENV_FILE: ${{ inputs.remote_env_file }}
      run: task ci:build-action
    - name: Upload build artifacts
      if: ${{ always() && inputs.remote_host == '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: build-${{ github.sha }}
        path: |
          ./build/lib/libmtl.so
          ./script/FFmpeg-release-7.0/ffmpeg
          ./tests/tools/RxTxApp/build/RxTxApp
          ./script/build/gstreamer_plugin/libgstmtl_*.so
          ./script/build/gstreamer_tools/*.so
          ./script/build/st22_avcodec_plugin/libst_plugin_st22_avcodec.so
