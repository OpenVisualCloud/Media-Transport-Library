name: Wait for Workflow
description: >
  Wait for one or more GitHub Actions check runs to complete successfully on the
  current commit.

inputs:
  check_name:
    description: >
      Check run names to wait for, one per line (a single name is the common case).
      Every name listed must reach conclusion success. A name that never appears is
      a timeout, not a pass -- that is the whole point of the gate.
    required: true
  workflow:
    description: >
      Workflow FILENAME the checks must belong to, e.g. build.yml or linter.yml
      -- the same filename contract .github/scripts/ci/find-nightly-runs.js uses
      for workflow_id, not the workflow's display name. Required, because a check
      run's name is its job name and matches across workflows: without this the
      gate for `build` also accepts the `build` job of GitHub's Pages deployment.
      The caller needs `actions: read` for the lookup.
    required: true
  timeout:
    description: 'Maximum in-progress time in seconds'
    required: false
    default: '600'
  queue_timeout:
    description: >
      Maximum time in seconds the check may sit queued for a runner. Keep it
      just inside the calling job's timeout-minutes: reaching it fails with the
      reason, where the job timeout fails without one.
    required: false
    default: '4200'
  interval:
    description: 'Polling interval in seconds'
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: Wait for workflow check
      id: wait
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        CHECK_NAMES: ${{ inputs.check_name }}
        WORKFLOW_FILE: ${{ inputs.workflow }}
        WAIT_TIMEOUT: ${{ inputs.timeout }}
        QUEUE_TIMEOUT: ${{ inputs.queue_timeout }}
        WAIT_INTERVAL: ${{ inputs.interval }}
      with:
        script: return require(`${{ github.action_path }}/wait.js`)({ github, context, core })
