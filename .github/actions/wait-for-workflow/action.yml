name: Wait for Workflow
description: >
  Wait for one or more GitHub Actions check runs to complete successfully on the
  current commit.

inputs:
  check_name:
    description: >
      Check run names to wait for, one per line (a single name is the common case).
      Every name listed must reach conclusion success. A name that never appears is
      a timeout, not a pass -- that is the whole point of the gate.
    required: true
  timeout:
    description: 'Maximum wait time in seconds'
    required: false
    default: '900'
  interval:
    description: 'Polling interval in seconds'
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: Wait for workflow check
      id: wait
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        CHECK_NAMES: ${{ inputs.check_name }}
        MAX_WAIT: ${{ inputs.timeout }}
        INTERVAL: ${{ inputs.interval }}
      with:
        script: |
          const sha = context.payload.pull_request?.head?.sha || context.sha;
          const checkNames = process.env.CHECK_NAMES
            .split('\n')
            .map(n => n.trim())
            .filter(Boolean);
          const maxWait = parseInt(process.env.MAX_WAIT, 10);
          const interval = parseInt(process.env.INTERVAL, 10);

          if (!checkNames.length) {
            core.setFailed('check_name is empty');
            return;
          }

          core.info(`Waiting for ${checkNames.map(n => `"${n}"`).join(', ')} on SHA: ${sha}`);
          const passed = new Set();
          let elapsed = 0;

          while (elapsed < maxWait) {
            const status = [];

            for (const checkName of checkNames) {
              if (passed.has(checkName)) continue;

              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: checkName,
              });

              const runs = data.check_runs.filter(r => r.app?.slug === 'github-actions');
              const pending = runs.some(r => r.status !== 'completed');

              if (runs.some(r => r.status === 'completed' && r.conclusion === 'success')) {
                core.info(`"${checkName}" passed ✓`);
                passed.add(checkName);
                continue;
              }

              // Only conclusive once nothing is still running: a re-run replaces a
              // failed attempt, and both attempts are visible while it happens.
              const failed = runs.find(r => r.status === 'completed' && r.conclusion !== 'success');
              if (failed && !pending) {
                core.setFailed(`"${checkName}" finished with: ${failed.conclusion}`);
                return;
              }

              status.push(`${checkName}: ${pending ? 'in_progress' : 'not found'}`);
            }

            if (passed.size === checkNames.length) {
              core.info(`All ${checkNames.length} check(s) passed ✓`);
              return;
            }

            core.info(`${status.join(' | ')} — waiting… (${elapsed}s / ${maxWait}s)`);
            await new Promise(r => setTimeout(r, interval * 1000));
            elapsed += interval;
          }

          const missing = checkNames.filter(n => !passed.has(n));
          core.setFailed(`Timed out waiting for ${missing.map(n => `"${n}"`).join(', ')}`);
