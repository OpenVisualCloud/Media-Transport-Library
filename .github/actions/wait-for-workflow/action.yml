name: Wait for Workflow
description: >
  Wait for a GitHub Actions check run to complete on the current commit.

inputs:
  check_name:
    description: 'The check run name to wait for (e.g. "build", "Lint Code Base")'
    required: true
  timeout:
    description: 'Maximum in-progress time in seconds'
    required: false
    default: '600'
  interval:
    description: 'Polling interval in seconds'
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: Wait for workflow check
      id: wait
      uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
      env:
        CHECK_NAME: ${{ inputs.check_name }}
        WAIT_TIMEOUT: ${{ inputs.timeout }}
        WAIT_INTERVAL: ${{ inputs.interval }}
      with:
        script: return require(`${{ github.action_path }}/wait.js`)({ github, context, core })
