name: Build Artifacts
description: >-
  Hash the sources of the checked-out commit, restore each cached build, build
  only the missing ones, validate all of them, and upload the install trees as
  the artifact mtl-build. The test jobs of the same run download that artifact.
  The cache only spares a rebuild, and only main saves it: GitHub evicts the
  entries that no job read for a while once the repository holds more than
  10 GB, and a pull request can read the caches of main.

outputs:
  mtl_commit:
    description: Commit the MTL sources were hashed and built from
    value: ${{ steps.commit.outputs.commit }}
  mtl_hash:
    description: MTL source checksum
    value: ${{ steps.sums.outputs.mtl }}
  jpegxs_hash:
    description: JPEG XS source checksum
    value: ${{ steps.sums.outputs.jpegxs }}
  ice_hash:
    description: ICE source checksum
    value: ${{ steps.sums.outputs.ice }}
  ffmpeg_hash:
    description: FFmpeg source checksum
    value: ${{ steps.sums.outputs.ffmpeg }}
  gstreamer_hash:
    description: GStreamer source checksum
    value: ${{ steps.sums.outputs.gstreamer }}
  plugins_hash:
    description: st22 avcodec plugin source checksum
    value: ${{ steps.sums.outputs.plugins }}

runs:
  using: composite
  steps:
    - name: Install Task
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        repo-token: ${{ github.token }}

    # The test jobs check out this commit, never the branch again, so that they
    # hash and restore the same sources that this job built.
    - name: Record the built commit
      id: commit
      shell: bash
      run: task ci:workflow -- commit

    # Before anything expensive: this runner is long-lived, and a missing libelf
    # otherwise surfaces as a pkg-config failure deep inside the build.
    - name: 'system: Check host prerequisites'
      shell: bash
      run: task ebpf:check-build

    - name: Compute source checksums
      id: sums
      uses: ./.github/actions/source-checksums

    - name: Compute exact cache keys
      id: keys
      shell: bash
      env:
        HASH_DPDK: ${{ steps.sums.outputs.dpdk }}
        HASH_MTL: ${{ steps.sums.outputs.mtl }}
        HASH_JPEGXS: ${{ steps.sums.outputs.jpegxs }}
        HASH_ICE: ${{ steps.sums.outputs.ice }}
        HASH_FFMPEG: ${{ steps.sums.outputs.ffmpeg }}
        HASH_GSTREAMER: ${{ steps.sums.outputs.gstreamer }}
        HASH_PLUGINS: ${{ steps.sums.outputs.plugins }}
      run: task ci:cache-keys

    - name: 'stash: Restore DPDK cache'
      id: dpdk-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.dpdk_key }}
        path: .local_install/dpdk

    - name: 'stash: Restore MTL cache'
      id: mtl-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.mtl_key }}
        # The plugin registry build.sh writes beside the MTL prefix.
        path: |
          .local_install/mtl
          .local_install/conf

    - name: 'stash: Restore JPEG XS cache'
      id: jpegxs-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.jpegxs_key }}
        path: .local_install/jpegxs

    - name: 'stash: Restore FFmpeg cache'
      id: ffmpeg-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.ffmpeg_key }}
        path: .local_install/ffmpeg

    - name: 'stash: Restore GStreamer cache'
      id: gstreamer-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.gstreamer_key }}
        path: .local_install/gstreamer

    - name: 'stash: Restore plugins cache'
      id: plugins-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.plugins_key }}
        path: .local_install/plugins

    - name: 'stash: Restore ICE cache'
      id: ice-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.ice_key }}
        path: .local_install/ice

    - name: Evaluate cache results
      id: cache-state
      shell: bash
      env:
        CACHE_HIT_DPDK: ${{ steps.dpdk-cache.outputs.cache-hit }}
        CACHE_HIT_MTL: ${{ steps.mtl-cache.outputs.cache-hit }}
        CACHE_HIT_JPEGXS: ${{ steps.jpegxs-cache.outputs.cache-hit }}
        CACHE_HIT_FFMPEG: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
        CACHE_HIT_GSTREAMER: ${{ steps.gstreamer-cache.outputs.cache-hit }}
        CACHE_HIT_PLUGINS: ${{ steps.plugins-cache.outputs.cache-hit }}
        CACHE_HIT_ICE: ${{ steps.ice-cache.outputs.cache-hit }}
      run: task ci:evaluate-caches

    - name: Build missing dependencies
      if: steps.cache-state.outputs.any_miss == '1'
      shell: bash
      run: task ci:build-dependencies

    - name: Validate dependency outputs
      shell: bash
      run: task ci:validate-dependencies

    # Main only. A pull request reads the caches of main, and its own entries
    # would push those out of the 10 GB of the repository.
    - name: 'stash: Save DPDK cache'
      if: success() && github.ref == 'refs/heads/main' && steps.cache-state.outputs.dpdk_miss == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.dpdk_key }}
        path: .local_install/dpdk

    - name: 'stash: Save MTL cache'
      if: success() && github.ref == 'refs/heads/main' && steps.cache-state.outputs.mtl_miss == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.mtl_key }}
        # The plugin registry build.sh writes beside the MTL prefix.
        path: |
          .local_install/mtl
          .local_install/conf

    - name: 'stash: Save JPEG XS cache'
      if: success() && github.ref == 'refs/heads/main' && steps.cache-state.outputs.jpegxs_miss == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.jpegxs_key }}
        path: .local_install/jpegxs

    - name: 'stash: Save FFmpeg cache'
      if: success() && github.ref == 'refs/heads/main' && steps.cache-state.outputs.ffmpeg_miss == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.ffmpeg_key }}
        path: .local_install/ffmpeg

    - name: 'stash: Save GStreamer cache'
      if: success() && github.ref == 'refs/heads/main' && steps.cache-state.outputs.gstreamer_miss == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.gstreamer_key }}
        path: .local_install/gstreamer

    - name: 'stash: Save plugins cache'
      if: success() && github.ref == 'refs/heads/main' && steps.cache-state.outputs.plugins_miss == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.plugins_key }}
        path: .local_install/plugins

    - name: 'stash: Save ICE cache'
      if: success() && github.ref == 'refs/heads/main' && steps.cache-state.outputs.ice_miss == '1'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.keys.outputs.ice_key }}
        path: .local_install/ice

    - name: Pack the install trees
      shell: bash
      run: task ci:pack-build

    - name: Upload the build for the test jobs of this run
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mtl-build
        path: mtl-build.tar.gz
        if-no-files-found: error
        # A re-run of a failed leg reuses the build of the first attempt, and a
        # leg can wait up to a day in the queue for a fleet runner.
        retention-days: 7
        # The file is gzip already.
        compression-level: 0
        overwrite: true
