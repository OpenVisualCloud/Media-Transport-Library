name: Validate Host
description: >-
  Download the build of this run, validate every dependency -- the host's own
  prerequisites and the install trees of the build -- then idempotently align
  the host. The job must need the build job of the run, which uploads the
  artifact mtl-build.

inputs:
  shadow_host:
    description: Path to a file defining IP and USER for the shadow host.
    required: false
    default: ''
  nic:
    description: >-
      NIC label of the runner this job landed on, i.e. runs-on. It decides
      whether the host needs the out-of-tree ICE driver: only the E8xx family is
      served by ice, so an i225/i226 runner neither validates nor activates
      the module. Empty means "assume it is needed", which is what an
      unlabeled runner such as the performance rig gets.
    required: false
    default: ''
  build_outputs:
    description: >-
      toJSON(needs.build.outputs) of the build job that this job tests. When
      set, the job fails before it downloads anything unless this checkout's
      source checksums are the ones that build hashed and built. Empty skips
      the check.
    required: false
    default: ''

outputs:
  shadow_host_ip:
    description: IP address of the shadow host
    value: ${{ steps.shadow-creds.outputs.ip }}
  shadow_host_user:
    description: Username for the shadow host
    value: ${{ steps.shadow-creds.outputs.user }}

runs:
  using: composite
  steps:
    # Every step below is a Task; a fleet runner does not have it on PATH.
    - name: Install Task
      uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
      with:
        repo-token: ${{ github.token }}

    - name: Cleanup processes
      shell: bash
      run: task cleanup

    - name: Compute local source checksums
      id: local-checksums
      if: inputs.build_outputs != ''
      uses: ./.github/actions/source-checksums

    # Other checksums than the build's mean that the scripts and tests of this
    # checkout are not the ones of the code that the build job built.
    - name: Check this checkout is the code the build job built
      if: inputs.build_outputs != ''
      shell: bash
      env:
        BUILD_OUTPUTS: ${{ inputs.build_outputs }}
        CHECKSUMS: ${{ toJSON(steps.local-checksums.outputs) }}
      run: task ci:workflow -- check-built-sources

    # The build job of this run uploads it. A cache would do, but GitHub evicts
    # an entry while a leg waits hours for a fleet runner.
    - name: Download the build of this run
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: mtl-build

    - name: Unpack the build
      shell: bash
      run: task ci:unpack-build

    - name: 'ice: Decide whether this host needs the ICE driver'
      id: ice
      shell: bash
      env:
        NIC: ${{ inputs.nic }}
      run: task ci:ice-required

    - name: Validate the downloaded dependencies
      shell: bash
      env:
        NIC: ${{ inputs.nic }}
      run: task ci:validate-dependencies

    - name: Make the downloaded binaries executable
      shell: bash
      run: task ci:configure-host -- make-executable

    - name: Refuse a stale DPDK driver link
      shell: bash
      run: task ci:configure-host -- dpdk-plugins

    - name: Preserve Task path for privileged activation
      shell: bash
      run: echo "TASK_BIN=$(command -v task)" >> "$GITHUB_ENV"

    # env -u BASH_XTRACEFD for the same reason as the run-gtest action: the
    # descriptor the variable names does not exist in the privileged shell.
    - name: Activate ICE if required
      if: steps.ice.outputs.required == 'true'
      shell: bash
      run: sudo -E env -u BASH_XTRACEFD "$TASK_BIN" ci:activate-ice

    - name: Set up DMA
      if: steps.ice.outputs.required == 'true'
      shell: bash
      run: sudo -E env -u BASH_XTRACEFD ./script/dma_setup.sh reset

    - name: Refuse stray system copies of the install's libraries
      shell: bash
      run: task ci:configure-host -- stray-libraries

    - name: Configure dependency environment
      shell: bash
      run: task ci:configure-host -- environment

    - name: Read shadow host credentials
      id: shadow-creds
      if: inputs.shadow_host != ''
      shell: bash
      env:
        SHADOW_HOST_FILE: ${{ inputs.shadow_host }}
      run: task ci:configure-host -- shadow-credentials

    - name: Sync caches to shadow host
      if: steps.shadow-creds.outputs.ip != ''
      shell: bash
      env:
        SHADOW_HOST_IP: ${{ steps.shadow-creds.outputs.ip }}
        SHADOW_HOST_USER: ${{ steps.shadow-creds.outputs.user }}
      run: task ci:configure-host -- shadow-sync

    - name: Activate ICE and set up DMA on the shadow host
      if: steps.shadow-creds.outputs.ip != '' && steps.ice.outputs.required == 'true'
      shell: bash
      env:
        SHADOW_HOST_IP: ${{ steps.shadow-creds.outputs.ip }}
        SHADOW_HOST_USER: ${{ steps.shadow-creds.outputs.user }}
      run: |
        task ci:configure-host -- shadow-activate-ice
        task ci:configure-host -- shadow-reset-dma
