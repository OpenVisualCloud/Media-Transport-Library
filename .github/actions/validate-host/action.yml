name: Validate Host
description: >-
  Restore and validate every dependency -- the host's own prerequisites and the
  cached artifacts -- then idempotently align the host.

inputs:
  shadow_host:
    description: Path to a file defining IP and USER for the shadow host.
    required: false
    default: ''
  nic:
    description: >-
      NIC label of the runner this job landed on, i.e. runs-on. It decides
      whether the host needs the Kahawai ICE driver: only the E8xx family is
      served by ice, so an i225/i226 runner neither restores that artifact nor
      aligns the module. Empty means "assume it is needed", which is what an
      unlabeled runner such as the performance rig gets.
    required: false
    default: ''
  build_outputs:
    description: >-
      toJSON(needs.build.outputs) of the build.yml call this job tests. When
      set, the job fails before restoring anything unless this checkout's
      source checksums are the ones that build hashed and built. Empty skips
      the check.
    required: false
    default: ''

outputs:
  shadow_host_ip:
    description: IP address of the shadow host
    value: ${{ steps.shadow-creds.outputs.ip }}
  shadow_host_user:
    description: Username for the shadow host
    value: ${{ steps.shadow-creds.outputs.user }}

runs:
  using: composite
  steps:
    # Every step below is a Task; a fleet runner does not have it on PATH.
    - name: Install Task
      uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

    - name: Cleanup processes
      shell: bash
      run: task cleanup

    - name: Compute local source checksums
      id: local-checksums
      uses: ./.github/actions/source-checksums

    # Other checksums than the build's either miss the cache below or restore
    # another tree's artifacts, so the job tests code that was not built.
    - name: Check this checkout is the code the build job built
      if: inputs.build_outputs != ''
      shell: bash
      env:
        BUILD_OUTPUTS: ${{ inputs.build_outputs }}
        CHECKSUMS: ${{ toJSON(steps.local-checksums.outputs) }}
      run: task ci:workflow -- check-built-sources

    - name: Compute exact cache keys
      id: keys
      shell: bash
      env:
        HASH_DPDK: ${{ steps.local-checksums.outputs.dpdk }}
        HASH_MTL: ${{ steps.local-checksums.outputs.mtl }}
        HASH_JPEGXS: ${{ steps.local-checksums.outputs.jpegxs }}
        HASH_ICE: ${{ steps.local-checksums.outputs.ice }}
        HASH_FFMPEG: ${{ steps.local-checksums.outputs.ffmpeg }}
        HASH_GSTREAMER: ${{ steps.local-checksums.outputs.gstreamer }}
        HASH_PLUGINS: ${{ steps.local-checksums.outputs.plugins }}
      run: task ci:cache-keys

    - name: 'cache: Restore DPDK'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        key: ${{ steps.keys.outputs.dpdk_key }}
        path: .local_install/dpdk
        fail-on-cache-miss: true

    - name: 'cache: Restore MTL'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        key: ${{ steps.keys.outputs.mtl_key }}
        path: .local_install/mtl
        fail-on-cache-miss: true

    - name: 'cache: Restore JPEG XS'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        key: ${{ steps.keys.outputs.jpegxs_key }}
        path: .local_install/jpegxs
        fail-on-cache-miss: true

    - name: 'cache: Restore FFmpeg'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        key: ${{ steps.keys.outputs.ffmpeg_key }}
        path: .local_install/ffmpeg
        fail-on-cache-miss: true

    - name: 'cache: Restore GStreamer'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        key: ${{ steps.keys.outputs.gstreamer_key }}
        path: .local_install/gstreamer
        fail-on-cache-miss: true

    - name: 'cache: Restore plugins'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        key: ${{ steps.keys.outputs.plugins_key }}
        path: .local_install/plugins
        fail-on-cache-miss: true

    - name: 'ice: Decide whether this host needs the ICE driver'
      id: ice
      shell: bash
      env:
        NIC: ${{ inputs.nic }}
      run: task ci:ice-required

    - name: 'cache: Restore ICE'
      if: steps.ice.outputs.required == 'true'
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        key: ${{ steps.keys.outputs.ice_key }}
        path: .local_install/ice
        fail-on-cache-miss: true

    - name: Validate restored dependencies
      shell: bash
      env:
        NIC: ${{ inputs.nic }}
      run: task ci:validate-dependencies

    - name: Make cached artifacts executable
      shell: bash
      run: task ci:configure-host -- make-executable

    - name: Align the DPDK driver plugin path with the restored tree
      shell: bash
      run: task ci:configure-host -- dpdk-plugins

    - name: Generate CI plugin registry
      shell: bash
      run: task ci:configure-host -- registry

    - name: Preserve Task path for privileged activation
      shell: bash
      run: echo "TASK_BIN=$(command -v task)" >> "$GITHUB_ENV"

    # env -u BASH_XTRACEFD for the same reason as gtest-bare-metal.yml: the
    # descriptor the variable names does not exist in the privileged shell.
    - name: Activate ICE if required
      if: steps.ice.outputs.required == 'true'
      shell: bash
      run: sudo -E env -u BASH_XTRACEFD "$TASK_BIN" ci:activate-ice

    - name: Configure dependency environment
      shell: bash
      run: task ci:configure-host -- environment

    - name: Read shadow host credentials
      id: shadow-creds
      if: inputs.shadow_host != ''
      shell: bash
      env:
        SHADOW_HOST_FILE: ${{ inputs.shadow_host }}
      run: task ci:configure-host -- shadow-credentials

    - name: Sync caches to shadow host
      if: steps.shadow-creds.outputs.ip != ''
      shell: bash
      env:
        SHADOW_HOST_IP: ${{ steps.shadow-creds.outputs.ip }}
        SHADOW_HOST_USER: ${{ steps.shadow-creds.outputs.user }}
      run: task ci:configure-host -- shadow-sync
