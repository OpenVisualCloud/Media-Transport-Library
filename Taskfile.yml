#
# Entry points that CI and developers share, so a local run and a runner run
# invoke exactly the same command. Install with:
#   go install github.com/go-task/task/v3/cmd/task@latest
# or see https://taskfile.dev/installation/
#
#   task --list

version: '3'

vars:
  EBPF_SCRIPT: '{{.TASKFILE_DIR}}/script/build_ebpf_xdp.sh'
  CI_SCRIPTS: '{{.TASKFILE_DIR}}/.github/scripts/ci'
  BANDIT_CONFIG: '{{.TASKFILE_DIR}}/.github/code-scan/bandit.config'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  ebpf:check:
    desc: Check this host's eBPF/XDP prerequisites; name the package for each missing one
    cmds:
      - bash {{.EBPF_SCRIPT}} --check

  ebpf:check-build:
    desc: Check only the prerequisites building MTL needs, not xdp-tools' own
    cmds:
      - bash {{.EBPF_SCRIPT}} --check build

  ebpf:install:
    desc: Build and install xdp-tools + libbpf at the versions in versions.env
    cmds:
      - bash {{.EBPF_SCRIPT}}

  ci:hash-dependencies:
    desc: Compute deterministic dependency source hashes
    cmds:
      - bash {{.TASKFILE_DIR}}/script/hash_sources.sh {{.CLI_ARGS}}

  ci:cache-keys:
    desc: Emit exact dependency cache keys for the current runner
    cmds:
      - |
        set -euo pipefail
        v=stash-v3
        jpegxs_cc=$(bash {{.CI_SCRIPTS}}/compiler-identity.sh producer)
        {
          echo "dpdk_key=${v}-dpdk-${HASH_DPDK:?}"
          echo "mtl_key=${v}-mtl-${HASH_MTL:?}"
          echo "jpegxs_key=${v}-jpegxs-$(uname -m)-${jpegxs_cc}-${HASH_JPEGXS:?}"
          echo "ffmpeg_key=${v}-ffmpeg-${HASH_FFMPEG:?}"
          echo "gstreamer_key=${v}-gstreamer-${HASH_GSTREAMER:?}"
          echo "plugins_key=${v}-plugins-${HASH_PLUGINS:?}"
          echo "ice_key=${v}-ice-${HASH_ICE:?}-$(uname -r)-$(uname -m)"
        } >>"${GITHUB_OUTPUT:-/dev/stdout}"

  ci:evaluate-caches:
    desc: Validate restored caches and export build-miss state
    silent: true
    cmds:
      - |
        set -euo pipefail
        any_miss=0
        for c in dpdk mtl jpegxs ffmpeg gstreamer plugins ice; do
          hit=CACHE_HIT_${c^^} miss=1 state=MISS
          if [ "${!hit:-}" = true ]; then
            bash {{.CI_SCRIPTS}}/validate-cache.sh "$c" || {
              echo "::error::$c cache is invalid at its immutable exact key" >&2
              echo "::error::Bump stash-v in the ci:cache-keys task of Taskfile.yml to rebuild under a new key" >&2
              exit 1
            }
            miss=0 state=HIT
          fi
          [ "$miss" = 0 ] || any_miss=1
          echo "CI_BUILD_${c^^}=$miss" >>"$GITHUB_ENV"
          echo "${c}_miss=$miss" >>"$GITHUB_OUTPUT"
          echo "::notice::$c=$state"
        done
        echo "any_miss=$any_miss" >>"$GITHUB_OUTPUT"

  ci:validate-cache:
    desc: Structurally validate one restored dependency cache
    requires:
      vars: [COMPONENT]
    cmds:
      - bash {{.CI_SCRIPTS}}/validate-cache.sh {{.COMPONENT}}

  ci:build-jpegxs:
    desc: Build the relocatable JPEG XS runtime and bridge bundle
    cmds:
      - bash {{.CI_SCRIPTS}}/build-jpegxs.sh

  ci:validate-jpegxs:
    desc: Validate the relocatable JPEG XS bundle
    cmds:
      - bash {{.CI_SCRIPTS}}/validate-jpegxs.sh

  ci:validate-ice:
    desc: Validate the cached ICE module against the running kernel
    cmds:
      - bash {{.CI_SCRIPTS}}/validate-ice.sh

  ci:activate-ice:
    desc: Reload the ICE driver from the cached module
    cmds:
      - bash {{.CI_SCRIPTS}}/activate-ice.sh

  ci:ice-required:
    desc: Report whether this job's NIC needs the Kahawai ICE driver
    cmds:
      - |
        nic="{{.CLI_ARGS}}"
        case "${nic:-${NIC:-}}" in i225 | i226) required=false ;; *) required=true ;; esac
        echo "$required"
        [ -z "${GITHUB_OUTPUT:-}" ] || echo "required=$required" >>"$GITHUB_OUTPUT"

  ci:bind-test-ports:
    desc: Bind one PF's trusted VFs and two DMA channels to vfio-pci for the gtest suite
    cmds:
      - bash {{.CI_SCRIPTS}}/bind-test-ports.sh

  ci:build-dependencies:
    desc: Build dependency cache misses selected by CI_BUILD_ variables
    cmds:
      - bash {{.CI_SCRIPTS}}/build-dependencies.sh

  ci:validate-dependencies:
    desc: Validate every dependency -- host prerequisites and all install trees
    cmds:
      - bash {{.EBPF_SCRIPT}} --check build
      - for: [dpdk, mtl, jpegxs, ffmpeg, gstreamer, plugins]
        task: ci:validate-cache
        vars: {COMPONENT: '{{.ITEM}}'}
      - '[ "$({{.TASK_EXE}} --silent ci:ice-required)" != true ] || {{.TASK_EXE}} ci:validate-cache COMPONENT=ice'

  ci:pytest-setup:
    desc: Prepare acceptance-test dependencies, session, NIC, or configuration
    cmds:
      - bash {{.CI_SCRIPTS}}/pytest-setup.sh {{.CLI_ARGS}}

  ci:pytest-run:
    desc: Run one acceptance-test workflow variant
    cmds:
      - bash {{.CI_SCRIPTS}}/pytest-run.sh {{.CLI_ARGS}}

  ci:media-assets:
    desc: List, verify or generate the test media a suite reads (MEDIA_ASSET_SET)
    cmds:
      - bash {{.CI_SCRIPTS}}/media-assets.sh {{.CLI_ARGS}}

  ci:ebu-list:
    desc: Check, start or stop the EBU LIST ST 2110 compliance analyser
    summary: |
      Runs .github/scripts/ci/ebu-list.sh {status|up|down|verify}.

      `verify` is the CI-facing check: it proves the analyser answers, speaks the
      API the acceptance framework's client speaks, and accepts the configured
      account, and that netsniff-ng can capture the pcap in the first place. It
      installs nothing -- it fails with the command that provisions. `up`/`down`
      drive the docker compose stack and are meant to be run by hand.
    cmds:
      - bash {{.CI_SCRIPTS}}/ebu-list.sh {{.CLI_ARGS}}

  ci:report:
    desc: Collect or transform CI test reports
    cmds:
      - bash {{.CI_SCRIPTS}}/reports.sh {{.CLI_ARGS}}

  ci:fuzz:
    desc: Build the fuzz targets with clang and ASan, or run each one for FUZZ_TIME seconds
    cmds:
      - bash {{.CI_SCRIPTS}}/fuzz.sh {{.CLI_ARGS}}

  ci:clang-tidy-setup:
    desc: Write compile_commands.json, from the cached DPDK, for the clang-tidy scan
    cmds:
      - bash {{.CI_SCRIPTS}}/clang-tidy-setup.sh

  ci:cargo-audit:
    desc: Audit the Rust lock files; rust/ commits none, so audit what a build resolves today
    cmds:
      - mkdir -p cargo-audit
      - cd rust && cargo generate-lockfile
      # The JSON reports are the job's artifact; the table runs are the gate, and the log.
      - cargo audit -f tests/tools/perf_debug_mcp/native/Cargo.lock --json > cargo-audit/perf_debug_mcp.json || true
      - cargo audit -f rust/Cargo.lock --json > cargo-audit/rust.json || true
      - cargo audit -f tests/tools/perf_debug_mcp/native/Cargo.lock
      - cargo audit -f rust/Cargo.lock

  ci:gtest-nightly:
    desc: Run the nightly bare-metal gtest harness
    cmds:
      - sudo -E {{.TASKFILE_DIR}}/.github/scripts/gtest.sh

  ci:run-metadata:
    desc: Write workflow run RUN_ID's date, number, branch and URL to GITHUB_OUTPUT
    set: [pipefail]
    cmds:
      - >-
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID"
        --jq '"run_date=\(.created_at)", "run_id=\(.id)", "run_number=\(.run_number)", "branch=\(.head_branch // "")", "run_url=\(.html_url)"'
        | tee -a "$GITHUB_OUTPUT"

  ci:workflow:
    desc: Run one workflow orchestration helper
    cmds:
      - bash {{.CI_SCRIPTS}}/workflow-ops.sh {{.CLI_ARGS}}

  ci:build-action:
    desc: Build MTL locally and optionally on a remote host
    set: [pipefail]
    cmds:
      - bash .github/scripts/setup_environment.sh
      - |
        if [[ -n ${REMOTE_HOST:-} ]]; then
          env_file=${REMOTE_ENV_FILE:-~/.mtl_build_env}
          [[ $env_file != "~"* ]] || env_file=$HOME${env_file#\~}
          {
            [[ -f $env_file ]] && cat "$env_file" || echo "::warning::No env file at $env_file; using defaults" >&2
            cat .github/scripts/remote_build.sh
          } | ssh -o StrictHostKeyChecking=no "$REMOTE_HOST" bash -s -- "${REMOTE_MTL_PATH:-}" "${REMOTE_BRANCH#refs/heads/}"
        fi

  ci:configure-host:
    desc: Configure cached dependency paths and plugin registry on a test host
    cmds:
      - bash {{.CI_SCRIPTS}}/configure-host.sh {{.CLI_ARGS}}

  # Bandit's default --exclude lists ".git" and matches it as a substring, so
  # it drops everything under .github/, even files named on the command line.
  # Each Bandit task passes -x '' to replace that list, with exactly the
  # tracked files as its input.
  ci:bandit:
    desc: Scan every tracked Python file with Bandit and the required test set; fails on any finding
    cmds:
      - git ls-files -z -- '*.py' | xargs -0 bandit -c {{.BANDIT_CONFIG}} -x ''

  ci:bandit-reports:
    desc: Write the Bandit scan as bandit.json, bandit.html and bandit.sarif; never fails on findings
    summary: |
      CI writes the reports before ci:bandit, so that they exist when the scan
      fails. --exit-zero leaves failing to ci:bandit.
    cmds:
      - |
        for format in json html sarif; do
          git ls-files -z -- '*.py' |
            xargs -0 bandit -q -c {{.BANDIT_CONFIG}} -x '' --exit-zero \
              -f "$format" -o "bandit.$format"
        done

  ci:bandit-summary:
    desc: Summarize bandit.json as Markdown, to GITHUB_STEP_SUMMARY in CI and to stdout elsewhere
    cmds:
      - |
        jq -r '
            "### Bandit", "",
            "| Files scanned | Lines of code | Findings | Reviewed `# nosec <ID>` | Blanket `# nosec` lines | Files skipped |",
            "|---:|---:|---:|---:|---:|---:|",
            "| \([.metrics | keys[] | select(. != "_totals")] - [.errors[].filename] | length) | \(.metrics._totals.loc) | \(.results | length) | \(.metrics._totals.skipped_tests) | \(.metrics._totals.nosec) | \(.errors | length) |",
            if .results == [] then empty else
              "", "| Test | Severity | Confidence | Location | Issue |", "|---|---|---|---|---|",
              (.results[] | "| [\(.test_id)](\(.more_info)) | \(.issue_severity) | \(.issue_confidence) | `\(.filename | ltrimstr("./")):\(.line_number)` | \(.issue_text) |")
            end,
            if .errors == [] then empty else
              "", "Skipped files:", (.errors[] | "- `\(.filename | ltrimstr("./"))`: \(.reason)")
            end,
            "", "HTML, JSON and SARIF reports: the `bandit-report` artifact of this run."
        ' bandit.json >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"

  ci:bandit-skipped:
    desc: Fail if bandit.json lists a file that Bandit skipped
    summary: |
      A file Bandit cannot parse or scan is skipped, and the run still exits 0.
      Its JSON report lists such files under "errors"; this requires it empty.
    cmds:
      - |
        jq -r '.errors[] | "skipped \(.filename): \(.reason)"' bandit.json
        jq -e '.errors == []' bandit.json > /dev/null
