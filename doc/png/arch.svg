<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1050" viewBox="0 0 1320 1050" role="img" aria-labelledby="t d">
<title id="t">Media Transport Library architecture</title>
<desc id="d">Apps connect to the Media Transport Library through Frames, RTP Passthrough and Datagram interfaces. MTL holds the Pipeline API, ST 2110 sessions, Color Format Conversion, Control Plane Protocols, Management and the Device Abstraction Layer. It runs on the DPDK PMD or Linux kernel network backends, over NIC and DMA hardware.</desc>
