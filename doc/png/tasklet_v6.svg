<rect x="50" y="786" width="1200" height="120" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<text x="74.0" y="824.9" font-size="20" fill="#1F271B" text-anchor="start">Each tasklet registers with the scheduler.</text>
<text x="74.0" y="850.9" font-size="20" fill="#1F271B" text-anchor="start">The scheduler calls tasklets 1 to 8 in turn, then starts again.</text>
<text x="74.0" y="876.9" font-size="20" fill="#1F271B" text-anchor="start">Note: the current code has no KNI tasklet. One CNI tasklet does ARP and IGMP.</text>
