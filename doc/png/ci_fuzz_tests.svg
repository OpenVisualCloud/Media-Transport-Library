<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="372" viewBox="0 0 1520 372" role="img" aria-labelledby="t d">
<title id="t">Fuzz Tests: feed random packets to the RX parsers</title>
<desc id="d">The libFuzzer harnesses are built with clang and ASan and each target runs for 60 seconds on a pull request and 600 seconds each night. The corpus is kept in the Actions cache.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1520" height="372" fill="#DCC7BE"/>
