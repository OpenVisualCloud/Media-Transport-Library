<path d="M1080.0 175.0 L1156.0 175.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M1170.0 175.0 L1156.0 182.0 L1156.0 168.0 Z" fill="#1F271B"/>
<rect x="390.0" y="123.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="540.0" y="162.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Detect changes</text>
<text x="540.0" y="186.0" font-size="14" fill="#ffffff" text-anchor="middle">path filter fuzz_tests: lib/,</text>
<text x="540.0" y="205.0" font-size="14" fill="#ffffff" text-anchor="middle">include/, tests/fuzz/</text>
<rect x="780.0" y="123.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="930.0" y="162.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Fuzz tests</text>
<text x="930.0" y="186.0" font-size="14" fill="#ffffff" text-anchor="middle">task ci:fuzz -- build, then task</text>
<text x="930.0" y="205.0" font-size="14" fill="#ffffff" text-anchor="middle">ci:fuzz -- run</text>
<rect x="1170.0" y="123.0" width="300.0" height="104.0" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="2.5"/>
<text x="1320.0" y="171.5" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">fuzz-tests-result</text>
<text x="1320.0" y="195.5" font-size="14" fill="#1F271B" text-anchor="middle">fails when a target exits non-zero</text>
<rect x="50.0" y="284.0" width="26.0" height="18.0" rx="4" fill="#0B4F6C"/>
<text x="84.0" y="298.0" font-size="14" fill="#1F271B" text-anchor="start">GitHub-hosted runner</text>
<rect x="248.0" y="284.0" width="26.0" height="18.0" rx="4" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="282.0" y="298.0" font-size="14" fill="#1F271B" text-anchor="start">Result check</text>
<text x="50.0" y="336.0" font-size="15" fill="#1F271B" text-anchor="start">The fuzz-report artifact holds the log and the crashing input of each target.</text>
