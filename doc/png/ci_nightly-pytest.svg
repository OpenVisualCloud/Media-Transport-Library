<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="346" viewBox="0 0 1520 346" role="img" aria-labelledby="t d">
<title id="t">nightly-pytest: every acceptance suite each weekday</title>
<desc id="d">Calls Build, then runs each of 14 pytest suite directories on each of the 3 NIC hosts, 42 legs. A last job merges the reports into one.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1520" height="346" fill="#DCC7BE"/>
<rect x="14" y="14" width="1492" height="318" rx="12" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="50.0" y="66.0" font-size="28" font-weight="700" fill="#1F271B" text-anchor="start">nightly-pytest: every acceptance suite each weekday</text>
<rect x="50.0" y="112.0" width="250.0" height="100.0" rx="8" fill="#DCC7BE" stroke="#1F271B" stroke-width="2.5"/>
<text x="175.0" y="139.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">Runs on</text>
<text x="175.0" y="168.0" font-size="15" fill="#1F271B" text-anchor="middle">Mon-Fri 18:07 UTC</text>
<text x="175.0" y="198.0" font-size="15" fill="#1F271B" text-anchor="middle">By hand (Run workflow)</text>
