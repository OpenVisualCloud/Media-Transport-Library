<path d="M390.0 162.0 L376.0 169.0 L376.0 155.0 Z" fill="#1F271B"/>
<path d="M690.0 162.0 L766.0 162.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M780.0 162.0 L766.0 169.0 L766.0 155.0 Z" fill="#1F271B"/>
<path d="M1080.0 162.0 L1156.0 162.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M1170.0 162.0 L1156.0 169.0 L1156.0 155.0 Z" fill="#1F271B"/>
<rect x="390.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#CBB9A8"/>
<text x="540.0" y="149.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">Build</text>
<text x="540.0" y="173.0" font-size="14" fill="#1F271B" text-anchor="middle">the Build workflow, as a called</text>
<text x="540.0" y="192.0" font-size="14" fill="#1F271B" text-anchor="middle">workflow</text>
<rect x="780.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#145C9E"/>
<text x="930.0" y="158.5" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Run pytest</text>
<text x="930.0" y="182.5" font-size="14" fill="#ffffff" text-anchor="middle">one suite directory on one NIC host</text>
<rect x="927.6" y="97.0" width="142.4" height="26.0" rx="13" fill="#1F271B"/>
<text x="998.8" y="115.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3 NIC x 14 dir</text>
<rect x="1170.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="1320.0" y="158.5" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Aggregate reports</text>
<text x="1320.0" y="182.5" font-size="14" fill="#ffffff" text-anchor="middle">task ci:report -- combine-pytest</text>
<rect x="50.0" y="258.0" width="26.0" height="18.0" rx="4" fill="#0B4F6C"/>
<text x="84.0" y="272.0" font-size="14" fill="#1F271B" text-anchor="start">GitHub-hosted runner</text>
<rect x="248.0" y="258.0" width="26.0" height="18.0" rx="4" fill="#145C9E"/>
<text x="282.0" y="272.0" font-size="14" fill="#1F271B" text-anchor="start">Self-hosted runner (NIC host)</text>
<rect x="514.4" y="258.0" width="26.0" height="18.0" rx="4" fill="#CBB9A8"/>
<text x="548.4" y="272.0" font-size="14" fill="#1F271B" text-anchor="start">Runs another workflow</text>
<text x="50.0" y="310.0" font-size="15" fill="#1F271B" text-anchor="start">Suites: cross_app, st40p, gstreamer, kernel_socket, ptp, rss_mode, rx_timing, st20p, st22p, st30p, st41, udp, virtio_user, xdp.</text>
