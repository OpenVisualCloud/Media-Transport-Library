<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="t d">
<title id="t">XDP in MTL</title>
<desc id="d">Left: the Linux kernel with the network stack, XDP, the BPF prog, the NIC driver, and two maps, udp_filter_map and xsks_map. Right: user space with two MTL app/session boxes, each with an AF_XDP socket. A two-way datapath arrow connects the BPF prog and the AF_XDP socket. The socket adds itself to xsks_map. The MTL app/session adds and deletes its UDP port in udp_filter_map.</desc>
