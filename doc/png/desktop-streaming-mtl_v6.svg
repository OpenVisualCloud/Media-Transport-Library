<text x="120.0" y="550.0" font-size="22" fill="#1F271B" text-anchor="start">The NUC captures its own desktop (FFmpeg x11grab) and MTL sends it.</text>
<circle cx="82" cy="594" r="22" fill="#1F271B" stroke="#1F271B" stroke-width="3"/><text x="82.0" y="603.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="120.0" y="602.0" font-size="22" fill="#1F271B" text-anchor="start">The video goes as an ST 2110 multicast stream through the switch.</text>
<circle cx="82" cy="646" r="22" fill="#1F271B" stroke="#1F271B" stroke-width="3"/><text x="82.0" y="655.0" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="120.0" y="654.0" font-size="22" fill="#1F271B" text-anchor="start">The SDM PC receives the stream and shows it in an SDL2 window.</text>
