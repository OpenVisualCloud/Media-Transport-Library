<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1166" viewBox="0 0 1400 1166" role="img" aria-labelledby="t d">
<title id="t">RTCP retransmission</title>
<desc id="d">TX sends RTP packets 0 to 3 to RX and keeps a copy of each in the RTP packets buffer. Packet 3 is lost. RX marks each sequence number in a bitmap and finds the gap. RX sends an RTCP NACK packet to TX. TX sends packet 3 again from the buffer, between packets 101 and 102. TX drops the oldest packets from the buffer.</desc>
