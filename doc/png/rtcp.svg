<text x="48.0" y="874.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">How RTCP retransmission works</text>
<circle cx="52" cy="919.4" r="5" fill="#1F271B"/>
<text x="68.0" y="926.0" font-size="20" fill="#1F271B" text-anchor="start">TX sends RTP packets and keeps a copy</text>
<text x="68.0" y="952.0" font-size="20" fill="#1F271B" text-anchor="start">of each one in the buffer.</text>
<circle cx="52" cy="977.4" r="5" fill="#1F271B"/>
<text x="68.0" y="984.0" font-size="20" fill="#1F271B" text-anchor="start">RX marks each sequence number in a bitmap.</text>
<circle cx="52" cy="1009.4" r="5" fill="#1F271B"/>
<text x="68.0" y="1016.0" font-size="20" fill="#1F271B" text-anchor="start">A gap older than the skip window is a loss.</text>
<circle cx="52" cy="1041.4" r="5" fill="#1F271B"/>
<text x="68.0" y="1048.0" font-size="20" fill="#1F271B" text-anchor="start">Each NACK interval, RX sends a NACK.</text>
<circle cx="52" cy="1073.4" r="5" fill="#1F271B"/>
<text x="68.0" y="1080.0" font-size="20" fill="#1F271B" text-anchor="start">TX sends the lost packet again.</text>
<circle cx="52" cy="1105.4" r="5" fill="#1F271B"/>
<text x="68.0" y="1112.0" font-size="20" fill="#1F271B" text-anchor="start">When the buffer is full, TX drops the oldest.</text>
<rect x="715" y="840" width="655" height="296" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<path d="M715 890 V848 Q715 840 723 840 H1362 Q1370 840 1370 848 V890 Z" fill="#0B4F6C" stroke="#1F271B" stroke-width="3"/>
<text x="733.0" y="874.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">Configuration (ops.rtcp)</text>
<circle cx="737" cy="919.4" r="5" fill="#1F271B"/>
<text x="753.0" y="926.0" font-size="20" fill="#1F271B" text-anchor="start">TX buffer_size: packets kept to send again</text>
<text x="753.0" y="952.0" font-size="20" fill="#1F271B" text-anchor="start">(not less than the TX descriptor count)</text>
<circle cx="737" cy="977.4" r="5" fill="#1F271B"/>
<text x="753.0" y="984.0" font-size="20" fill="#1F271B" text-anchor="start">RX nack_interval_us: how often RX checks</text>
<text x="753.0" y="1010.0" font-size="20" fill="#1F271B" text-anchor="start">for loss and sends a NACK</text>
<circle cx="737" cy="1035.4" r="5" fill="#1F271B"/>
<text x="753.0" y="1042.0" font-size="20" fill="#1F271B" text-anchor="start">RX seq_bitmap_size: tracks size x 8 packets</text>
<circle cx="737" cy="1067.4" r="5" fill="#1F271B"/>
<text x="753.0" y="1074.0" font-size="20" fill="#1F271B" text-anchor="start">RX seq_skip_window: out-of-order range</text>
<text x="753.0" y="1100.0" font-size="20" fill="#1F271B" text-anchor="start">that gives no NACK</text>
</g>
</svg>
