<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="350" viewBox="0 0 1130 350" role="img" aria-labelledby="t d">
<title id="t">Documentation: build, and publish from main</title>
<desc id="d">Sphinx builds the documentation on every pull request. On main the result is published to GitHub Pages.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1130" height="350" fill="#DCC7BE"/>
<rect x="14" y="14" width="1102" height="322" rx="12" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="50.0" y="66.0" font-size="28" font-weight="700" fill="#1F271B" text-anchor="start">Documentation: build, and publish from main</text>
<rect x="50.0" y="110.0" width="250.0" height="130.0" rx="8" fill="#DCC7BE" stroke="#1F271B" stroke-width="2.5"/>
<text x="175.0" y="137.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">Runs on</text>
<text x="175.0" y="166.0" font-size="15" fill="#1F271B" text-anchor="middle">Pull request</text>
<text x="175.0" y="196.0" font-size="15" fill="#1F271B" text-anchor="middle">Push to main</text>
<text x="175.0" y="226.0" font-size="15" fill="#1F271B" text-anchor="middle">By hand (Run workflow)</text>
<path d="M300.0 175.0 L376.0 175.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M390.0 175.0 L376.0 182.0 L376.0 168.0 Z" fill="#1F271B"/>
<path d="M690.0 175.0 L766.0 175.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M780.0 175.0 L766.0 182.0 L766.0 168.0 Z" fill="#1F271B"/>
<rect x="390.0" y="123.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="540.0" y="162.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Build documentation</text>
<text x="540.0" y="186.0" font-size="14" fill="#ffffff" text-anchor="middle">Sphinx: make -C doc/sphinx html,</text>
<text x="540.0" y="205.0" font-size="14" fill="#ffffff" text-anchor="middle">upload the Pages artifact</text>
<rect x="780.0" y="123.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="930.0" y="171.5" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Publish GitHub Pages</text>
<text x="930.0" y="195.5" font-size="14" fill="#ffffff" text-anchor="middle">main only, never a pull request</text>
<rect x="50.0" y="284.0" width="26.0" height="18.0" rx="4" fill="#0B4F6C"/>
<text x="84.0" y="298.0" font-size="14" fill="#1F271B" text-anchor="start">GitHub-hosted runner</text>
</g>
</svg>
