<path d="M1080.0 292.0 L1125.0 292.0 L1125.0 227.0 L1156.0 227.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M1170.0 227.0 L1156.0 234.0 L1156.0 220.0 Z" fill="#1F271B"/>
<path d="M1470.0 227.0 L1546.0 227.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M1560.0 227.0 L1546.0 234.0 L1546.0 220.0 Z" fill="#1F271B"/>
<rect x="390.0" y="175.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="540.0" y="223.5" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Detect changes</text>
<text x="540.0" y="247.5" font-size="14" fill="#ffffff" text-anchor="middle">path filter build_workflow</text>
<rect x="780.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="930.0" y="149.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Wait for Linter</text>
<text x="930.0" y="173.0" font-size="14" fill="#ffffff" text-anchor="middle">no build before the style checks</text>
<text x="930.0" y="192.0" font-size="14" fill="#ffffff" text-anchor="middle">pass; skipped on main</text>
<rect x="780.0" y="240.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="930.0" y="279.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Source checksums</text>
<text x="930.0" y="303.0" font-size="14" fill="#ffffff" text-anchor="middle">hash of the sources each cache is</text>
<text x="930.0" y="322.0" font-size="14" fill="#ffffff" text-anchor="middle">built from</text>
<rect x="1170.0" y="175.0" width="300.0" height="104.0" rx="8" fill="#145C9E"/>
<text x="1320.0" y="214.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Build</text>
<text x="1320.0" y="238.0" font-size="14" fill="#ffffff" text-anchor="middle">restore 7 caches, build the misses,</text>
<text x="1320.0" y="257.0" font-size="14" fill="#ffffff" text-anchor="middle">validate, save (DPDK host)</text>
<rect x="1560.0" y="175.0" width="300.0" height="104.0" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="2.5"/>
<text x="1710.0" y="223.5" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">build-result</text>
<text x="1710.0" y="247.5" font-size="14" fill="#1F271B" text-anchor="middle">one status for branch protection</text>
<rect x="50.0" y="388.0" width="26.0" height="18.0" rx="4" fill="#0B4F6C"/>
<text x="84.0" y="402.0" font-size="14" fill="#1F271B" text-anchor="start">GitHub-hosted runner</text>
<rect x="248.0" y="388.0" width="26.0" height="18.0" rx="4" fill="#145C9E"/>
<text x="282.0" y="402.0" font-size="14" fill="#1F271B" text-anchor="start">Self-hosted runner (NIC host)</text>
<rect x="514.4" y="388.0" width="26.0" height="18.0" rx="4" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="548.4" y="402.0" font-size="14" fill="#1F271B" text-anchor="start">Result check</text>
<text x="50.0" y="440.0" font-size="15" fill="#1F271B" text-anchor="start">Caches: DPDK, MTL, JPEG XS, FFmpeg, GStreamer, plugins, ICE driver. task ci:cache-keys names each one; a cache whose sources did not change is reused, not rebuilt.</text>
</g>
