<path d="M690.0 227.0 L735.0 227.0 L735.0 292.0 L766.0 292.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M780.0 292.0 L766.0 299.0 L766.0 285.0 Z" fill="#1F271B"/>
<path d="M1080.0 162.0 L1125.0 162.0 L1125.0 227.0 L1156.0 227.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
