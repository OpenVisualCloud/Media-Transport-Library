<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1910" height="476" viewBox="0 0 1910 476" role="img" aria-labelledby="t d">
<title id="t">Build: build once, cache for every hardware test</title>
<desc id="d">After the linter passes, the build job runs on the DPDK host. It restores the seven dependency caches, builds only the ones that missed, validates them and saves them. Bare-metal test jobs restore the same caches.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1910" height="476" fill="#DCC7BE"/>
<rect x="14" y="14" width="1882" height="448" rx="12" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="50.0" y="66.0" font-size="28" font-weight="700" fill="#1F271B" text-anchor="start">Build: build once, cache for every hardware test</text>
<rect x="50.0" y="147.0" width="250.0" height="160.0" rx="8" fill="#DCC7BE" stroke="#1F271B" stroke-width="2.5"/>
<text x="175.0" y="174.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">Runs on</text>
<text x="175.0" y="203.0" font-size="15" fill="#1F271B" text-anchor="middle">Pull request</text>
<text x="175.0" y="233.0" font-size="15" fill="#1F271B" text-anchor="middle">Push to main / maint-*</text>
<text x="175.0" y="263.0" font-size="15" fill="#1F271B" text-anchor="middle">By hand (Run workflow)</text>
<text x="175.0" y="293.0" font-size="15" fill="#1F271B" text-anchor="middle">Called by nightly / custom</text>
