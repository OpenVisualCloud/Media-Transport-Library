<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1320" viewBox="0 0 1100 1320" role="img" aria-labelledby="t d">
<title id="t">AF_XDP socket, its four rings and the UMEM</title>
<desc id="d">The AF_XDP socket is bound to one NIC hardware queue. The TX app puts descriptors in the TX ring and takes them back from the Completion ring. The RX app takes descriptors from the RX ring and gives free frames back in the Fill ring. Each descriptor points to a frame in the UMEM.</desc>
