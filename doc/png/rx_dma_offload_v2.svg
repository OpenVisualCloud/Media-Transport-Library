<rect x="70" y="240" width="120" height="50" rx="6" fill="#ffffff" stroke="#202932" stroke-width="2"/>
<text x="130.0" y="268.7" font-size="15" font-weight="700" fill="#101820" text-anchor="middle">Header</text>
<rect x="200" y="240" width="330" height="50" rx="6" fill="#ffd166" stroke="#715400" stroke-width="2"/>
<text x="365.0" y="268.7" font-size="15" font-weight="700" fill="#101820" text-anchor="middle">Payload</text>
