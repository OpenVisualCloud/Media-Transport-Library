<rect x="16" y="16" width="1288" height="904" rx="12" fill="#ffffff" stroke="#202932" stroke-width="2"/>
<rect x="40" y="40" width="520" height="500" rx="6" fill="#d7e1e8" stroke="#314958" stroke-width="2" stroke-dasharray="7 5"/>
<text x="300.0" y="68.0" font-size="17" font-weight="700" fill="#101820" text-anchor="middle">Host memory: RX packets</text>
<rect x="760" y="40" width="520" height="500" rx="6" fill="#d7e1e8" stroke="#314958" stroke-width="2" stroke-dasharray="7 5"/>
<text x="1020.0" y="68.0" font-size="17" font-weight="700" fill="#101820" text-anchor="middle">Host memory: raw video frame</text>
<rect x="70" y="100" width="120" height="50" rx="6" fill="#ffffff" stroke="#202932" stroke-width="2"/>
<text x="130.0" y="128.7" font-size="15" font-weight="700" fill="#101820" text-anchor="middle">Header</text>
