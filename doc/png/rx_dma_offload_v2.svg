<text x="1020.0" y="268.7" font-size="15" font-weight="700" fill="#101820" text-anchor="middle">Payload</text>
<path d="M560.0 254.0 L742.0 254.0 L742.0 244.0 L760.0 265.0 L742.0 286.0 L742.0 276.0 L560.0 276.0 Z" fill="#087ca7" stroke="#004d69" stroke-width="2" stroke-linejoin="round"/>
<rect x="70" y="450" width="120" height="50" rx="6" fill="#ffffff" stroke="#202932" stroke-width="2"/>
<text x="130.0" y="478.7" font-size="15" font-weight="700" fill="#101820" text-anchor="middle">Header</text>
<rect x="200" y="450" width="330" height="50" rx="6" fill="#ffd166" stroke="#715400" stroke-width="2"/>
<text x="365.0" y="478.7" font-size="15" font-weight="700" fill="#101820" text-anchor="middle">Payload</text>
