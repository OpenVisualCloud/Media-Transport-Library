<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="936" viewBox="0 0 1320 936" role="img" aria-labelledby="t d">
<title id="t">RTP decapsulation with DMA engine acceleration</title>
<desc id="d">The DMA engine copies the payload of each received packet from host memory into the raw video frame, also in host memory. The CPU does not copy the payload.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
