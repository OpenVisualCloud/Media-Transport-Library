<rect x="70" y="170" width="120" height="50" rx="6" fill="#ffffff" stroke="#202932" stroke-width="2"/>
<text x="130.0" y="198.7" font-size="15" font-weight="700" fill="#101820" text-anchor="middle">Header</text>
