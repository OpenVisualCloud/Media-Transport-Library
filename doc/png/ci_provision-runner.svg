<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="346" viewBox="0 0 1000 346" role="img" aria-labelledby="t d">
<title id="t">Provision runner: install what a NIC host is missing</title>
<desc id="d">By hand only. Installs the host build packages and the acceptance virtualenv on the chosen runner, then runs the same verify step the test jobs run.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1000" height="346" fill="#DCC7BE"/>
<rect x="14" y="14" width="972" height="318" rx="12" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="50.0" y="66.0" font-size="28" font-weight="700" fill="#1F271B" text-anchor="start">Provision runner: install what a NIC host is missing</text>
<rect x="50.0" y="127.0" width="250.0" height="70.0" rx="8" fill="#DCC7BE" stroke="#1F271B" stroke-width="2.5"/>
<text x="175.0" y="154.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">Runs on</text>
<text x="175.0" y="183.0" font-size="15" fill="#1F271B" text-anchor="middle">By hand: nic</text>
<path d="M300.0 162.0 L376.0 162.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M390.0 162.0 L376.0 169.0 L376.0 155.0 Z" fill="#1F271B"/>
<rect x="390.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#145C9E"/>
<text x="540.0" y="149.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Provision</text>
<text x="540.0" y="173.0" font-size="14" fill="#ffffff" text-anchor="middle">report, task ci:pytest-setup --</text>
<text x="540.0" y="192.0" font-size="14" fill="#ffffff" text-anchor="middle">install, then -- verify</text>
<rect x="50.0" y="258.0" width="26.0" height="18.0" rx="4" fill="#145C9E"/>
<text x="84.0" y="272.0" font-size="14" fill="#1F271B" text-anchor="start">Self-hosted runner (NIC host)</text>
<text x="50.0" y="310.0" font-size="15" fill="#1F271B" text-anchor="start">Test jobs never install anything; this workflow is the one place that does.</text>
</g>
</svg>
