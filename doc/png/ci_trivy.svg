<title id="t">Trivy: vulnerability scans and SBOM</title>
<desc id="d">Four independent Trivy jobs scan the repository and the manager, write an SPDX SBOM and fail on a CRITICAL or HIGH vulnerability. The 00:00 run scans main, the 23:00 run scans maint-25.02.</desc>
