<title id="t">Which workflow runs when</title>
<desc id="d">Pull requests run the linter, builds, unit, fuzz, smoke and gtest workflows. Pushes to main add the scorecard and documentation publish. Nightly runs add Coverity, Trivy, perf, gtest and pytest. Some workflows run only by hand.</desc>
