<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="830" viewBox="0 0 1320 830" role="img" aria-labelledby="t d">
<title id="t">Desktop streaming with MTL (asynchronous playback)</title>
<desc id="d">The sending device, an Intel NUC with i225 Ethernet at IP 192.168.100.32/24, streams its own desktop to multicast 239.168.85.20. A 2.5GbE link connects it to a 10GbE switch, and a 2.5GbE link connects the switch to the receiving device, an Intel SDM based PC with i225 Ethernet at IP 192.168.100.30/24.</desc>
