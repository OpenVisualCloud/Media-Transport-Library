<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="346" viewBox="0 0 1130 346" role="img" aria-labelledby="t d">
<title id="t">PR Gate: shared first step of the bare-metal tests</title>
<desc id="d">Called by smoke-tests and gtest-bare-metal. It checks whether the change touches what the tests cover, and if so waits for the Build workflow of the same commit to publish its caches.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1130" height="346" fill="#DCC7BE"/>
<rect x="14" y="14" width="1102" height="318" rx="12" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="50.0" y="66.0" font-size="28" font-weight="700" fill="#1F271B" text-anchor="start">PR Gate: shared first step of the bare-metal tests</text>
<rect x="50.0" y="112.0" width="250.0" height="100.0" rx="8" fill="#DCC7BE" stroke="#1F271B" stroke-width="2.5"/>
<text x="175.0" y="139.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">Runs on</text>
<text x="175.0" y="168.0" font-size="15" fill="#1F271B" text-anchor="middle">Called by smoke-tests</text>
<text x="175.0" y="198.0" font-size="15" fill="#1F271B" text-anchor="middle">Called by gtest-bare-metal</text>
<path d="M300.0 162.0 L376.0 162.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M390.0 162.0 L376.0 169.0 L376.0 155.0 Z" fill="#1F271B"/>
<path d="M690.0 162.0 L766.0 162.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M780.0 162.0 L766.0 169.0 L766.0 155.0 Z" fill="#1F271B"/>
<rect x="390.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="540.0" y="149.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Check for changes</text>
<text x="540.0" y="173.0" font-size="14" fill="#ffffff" text-anchor="middle">the filter the caller names, e.g.</text>
<text x="540.0" y="192.0" font-size="14" fill="#ffffff" text-anchor="middle">smoke_tests or gtest</text>
<rect x="780.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="930.0" y="158.5" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Wait for Build</text>
<text x="930.0" y="182.5" font-size="14" fill="#ffffff" text-anchor="middle">until Build of this commit finishes</text>
<rect x="50.0" y="258.0" width="26.0" height="18.0" rx="4" fill="#0B4F6C"/>
<text x="84.0" y="272.0" font-size="14" fill="#1F271B" text-anchor="start">GitHub-hosted runner</text>
<text x="50.0" y="310.0" font-size="15" fill="#1F271B" text-anchor="start">A manual run skips the wait and always tests.</text>
</g>
</svg>
