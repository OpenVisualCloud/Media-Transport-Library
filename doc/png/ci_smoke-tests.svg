<path d="M690.0 175.0 L766.0 175.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M780.0 175.0 L766.0 182.0 L766.0 168.0 Z" fill="#1F271B"/>
<path d="M1080.0 175.0 L1156.0 175.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M1170.0 175.0 L1156.0 182.0 L1156.0 168.0 Z" fill="#1F271B"/>
<rect x="390.0" y="123.0" width="300.0" height="104.0" rx="8" fill="#CBB9A8"/>
<text x="540.0" y="171.5" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">PR Gate</text>
<text x="540.0" y="195.5" font-size="14" fill="#1F271B" text-anchor="middle">changed? then wait for Build</text>
<rect x="780.0" y="123.0" width="300.0" height="104.0" rx="8" fill="#145C9E"/>
<text x="930.0" y="162.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Smoke tests</text>
<text x="930.0" y="186.0" font-size="14" fill="#ffffff" text-anchor="middle">restore caches, configure pytest,</text>
<text x="930.0" y="205.0" font-size="14" fill="#ffffff" text-anchor="middle">run the suite, upload report</text>
<rect x="884.6" y="110.0" width="185.4" height="26.0" rx="13" fill="#1F271B"/>
<text x="977.3" y="128.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">e810 e830 e835 i225</text>
<rect x="1170.0" y="123.0" width="300.0" height="104.0" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="2.5"/>
<text x="1320.0" y="162.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">smoke-tests-result</text>
<text x="1320.0" y="186.0" font-size="14" fill="#1F271B" text-anchor="middle">i225 is optional and does not fail</text>
<text x="1320.0" y="205.0" font-size="14" fill="#1F271B" text-anchor="middle">it</text>
<rect x="50.0" y="284.0" width="26.0" height="18.0" rx="4" fill="#145C9E"/>
<text x="84.0" y="298.0" font-size="14" fill="#1F271B" text-anchor="start">Self-hosted runner (NIC host)</text>
<rect x="316.4" y="284.0" width="26.0" height="18.0" rx="4" fill="#CBB9A8"/>
<text x="350.4" y="298.0" font-size="14" fill="#1F271B" text-anchor="start">Runs another workflow</text>
<rect x="522.0" y="284.0" width="26.0" height="18.0" rx="4" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="556.0" y="298.0" font-size="14" fill="#1F271B" text-anchor="start">Result check</text>
<text x="50.0" y="336.0" font-size="15" fill="#1F271B" text-anchor="start">Each leg: task ci:pytest-setup (session, PCI, config), task ci:media-assets -- verify, task ci:ebu-list -- verify, task ci:pytest-run -- smoke.</text>
