<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="372" viewBox="0 0 1520 372" role="img" aria-labelledby="t d">
<title id="t">smoke-tests-bare-metal: a short pytest suite on each NIC</title>
<desc id="d">After the PR gate, the smoke pytest suite runs on the E810, E830 and E835 hosts, and a low-bandwidth variant on the optional i225 host. Each leg restores the Build caches, checks media and the EBU LIST analyser, then runs.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="1520" height="372" fill="#DCC7BE"/>
<rect x="14" y="14" width="1492" height="344" rx="12" fill="#ffffff" stroke="#1F271B" stroke-width="2"/>
<text x="50.0" y="66.0" font-size="28" font-weight="700" fill="#1F271B" text-anchor="start">smoke-tests-bare-metal: a short pytest suite on each NIC</text>
<rect x="50.0" y="110.0" width="250.0" height="130.0" rx="8" fill="#DCC7BE" stroke="#1F271B" stroke-width="2.5"/>
<text x="175.0" y="137.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">Runs on</text>
<text x="175.0" y="166.0" font-size="15" fill="#1F271B" text-anchor="middle">Pull request</text>
<text x="175.0" y="196.0" font-size="15" fill="#1F271B" text-anchor="middle">Push to main / maint-*</text>
<text x="175.0" y="226.0" font-size="15" fill="#1F271B" text-anchor="middle">By hand (Run workflow)</text>
