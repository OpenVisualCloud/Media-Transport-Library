<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="858" viewBox="0 0 1400 858" role="img" aria-labelledby="t d">
<title id="t">TX packet pacing</title>
<desc id="d">A frame goes into the packet builder, which builds packets with a timestamp. The packets go to one of three pacing ways: TSC pacing, RL pacing, or TSN pacing. The paced packets then go to the NIC.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1400" height="858" fill="#ffffff"/>
<text x="30.0" y="60.0" font-size="34" font-weight="700" fill="#1F271B" text-anchor="start">TX packet pacing</text>
<rect x="30" y="90" width="660" height="226" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<path d="M30 140 V98 Q30 90 38 90 H682 Q690 90 690 98 V140 Z" fill="#145C9E" stroke="#1F271B" stroke-width="3"/>
<text x="48.0" y="124.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">RL pacing: queue rate limit of the NIC</text>
<circle cx="52" cy="169.4" r="5" fill="#1F271B"/>
<text x="68.0" y="176.0" font-size="20" fill="#1F271B" text-anchor="start">Many modern NICs support it.</text>
<circle cx="52" cy="201.4" r="5" fill="#1F271B"/>
<text x="68.0" y="208.0" font-size="20" fill="#1F271B" text-anchor="start">A padding-based runtime profile improves</text>
<text x="68.0" y="234.0" font-size="20" fill="#1F271B" text-anchor="start">the precision and granularity for VRX.</text>
<circle cx="52" cy="259.4" r="5" fill="#1F271B"/>
<text x="68.0" y="266.0" font-size="20" fill="#1F271B" text-anchor="start">A warmup before the first packet meets</text>
<text x="68.0" y="292.0" font-size="20" fill="#1F271B" text-anchor="start">the critical TR_OFFSET.</text>
<rect x="30" y="338" width="660" height="168" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<path d="M30 388 V346 Q30 338 38 338 H682 Q690 338 690 346 V388 Z" fill="#0B4F6C" stroke="#1F271B" stroke-width="3"/>
<text x="48.0" y="372.0" font-size="24" font-weight="700" fill="#ffffff" text-anchor="start">TSN pacing: NIC TX timestamp</text>
<circle cx="52" cy="417.4" r="5" fill="#1F271B"/>
<text x="68.0" y="424.0" font-size="20" fill="#1F271B" text-anchor="start">Full hardware solution.</text>
<circle cx="52" cy="449.4" r="5" fill="#1F271B"/>
<text x="68.0" y="456.0" font-size="20" fill="#1F271B" text-anchor="start">Needs an Intel E830 NIC, a PF port,</text>
<text x="68.0" y="482.0" font-size="20" fill="#1F271B" text-anchor="start">and the built-in PTP. E810: no support.</text>
<rect x="30" y="528" width="660" height="232" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<path d="M30 578 V536 Q30 528 38 528 H682 Q690 528 690 536 V578 Z" fill="#CBB9A8" stroke="#1F271B" stroke-width="3"/>
<text x="48.0" y="562.0" font-size="24" font-weight="700" fill="#1F271B" text-anchor="start">TSC pacing (fallback): CPU rdtsc</text>
<circle cx="52" cy="607.4" r="5" fill="#1F271B"/>
<text x="68.0" y="614.0" font-size="20" fill="#1F271B" text-anchor="start">Does not depend on a NIC feature.</text>
<circle cx="52" cy="639.4" r="5" fill="#1F271B"/>
<text x="68.0" y="646.0" font-size="20" fill="#1F271B" text-anchor="start">The TSC frequency is about 3 GHz.</text>
<circle cx="52" cy="671.4" r="5" fill="#1F271B"/>
<text x="68.0" y="678.0" font-size="20" fill="#1F271B" text-anchor="start">Modern x86 CPUs have constant_tsc.</text>
<circle cx="52" cy="703.4" r="5" fill="#1F271B"/>
<text x="68.0" y="710.0" font-size="20" fill="#1F271B" text-anchor="start">VRX and TR_OFFSET fail if the</text>
<text x="68.0" y="736.0" font-size="20" fill="#1F271B" text-anchor="start">tasklet is scheduled out.</text>
