<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="606" viewBox="0 0 1130 606" role="img" aria-labelledby="t d">
<title id="t">Linter: style checks on every pull request</title>
<desc id="d">On a pull request, checkpatch runs pre-commit on Linux, macOS and Windows and super-linter runs the checks not yet in pre-commit. Lint Code Base passes when both pass. The commit message style is checked on its own.</desc>
