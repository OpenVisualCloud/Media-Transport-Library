<text x="282.0" y="532.0" font-size="14" fill="#1F271B" text-anchor="start">Result check</text>
<text x="50.0" y="570.0" font-size="15" fill="#1F271B" text-anchor="start">Run the same checks before you push: pre-commit run --all-files.</text>
