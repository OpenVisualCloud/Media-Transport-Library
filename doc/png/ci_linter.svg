<text x="540.0" y="149.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">checkpatch</text>
<text x="540.0" y="173.0" font-size="14" fill="#ffffff" text-anchor="middle">pre-commit: clang-format, shfmt,</text>
<text x="540.0" y="192.0" font-size="14" fill="#ffffff" text-anchor="middle">black, yamllint, ...</text>
<rect x="615.0" y="97.0" width="65.0" height="26.0" rx="13" fill="#1F271B"/>
<text x="647.5" y="115.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">x3 OS</text>
<rect x="390.0" y="240.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="540.0" y="279.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Residual linters</text>
<text x="540.0" y="303.0" font-size="14" fill="#ffffff" text-anchor="middle">super-linter for the checks not yet</text>
<text x="540.0" y="322.0" font-size="14" fill="#ffffff" text-anchor="middle">in pre-commit</text>
<rect x="390.0" y="370.0" width="300.0" height="104.0" rx="8" fill="#0B4F6C"/>
<text x="540.0" y="409.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Commit message style</text>
<text x="540.0" y="433.0" font-size="14" fill="#ffffff" text-anchor="middle">gitlint on each commit of the pull</text>
<text x="540.0" y="452.0" font-size="14" fill="#ffffff" text-anchor="middle">request</text>
