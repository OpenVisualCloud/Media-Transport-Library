<title id="t">MTL software stack</title>
<desc id="d">The control plane configures sessions, schedules tasklets, trains the rate limit pacing and sets up devices. The data plane moves frames from the TX app through the packet encapsulation and transmitter tasklets to the NIC, and from the NIC through the burst and decapsulation tasklets, with an optional DMA copy, to the RX app.</desc>
