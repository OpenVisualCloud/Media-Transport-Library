<rect x="270" y="340" width="200" height="120" rx="14" fill="#0B4F6C" stroke="#1F271B" stroke-width="3"/>
<text x="370.0" y="406.4" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">BPF prog</text>
<rect x="50" y="510" width="420" height="110" rx="14" fill="#145C9E" stroke="#1F271B" stroke-width="3"/>
<text x="260.0" y="571.4" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">NIC Driver</text>
