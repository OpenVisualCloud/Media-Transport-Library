<rect x="840" y="20" width="540" height="680" rx="28" fill="#DCC7BE" stroke="#1F271B" stroke-width="3"/>
<text x="1150.0" y="670.0" font-size="30" font-weight="700" fill="#1F271B" text-anchor="middle">User space</text>
<rect x="50" y="130" width="420" height="160" rx="14" fill="#1F271B" stroke="#1F271B" stroke-width="3"/>
