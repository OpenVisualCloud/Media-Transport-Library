<text x="525.0" y="500.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<rect x="20" y="740" width="1360" height="260" rx="14" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<circle cx="70" cy="790" r="22" fill="#1F271B" stroke="#1F271B" stroke-width="3"/>
<text x="70.0" y="798.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="120.0" y="798.0" font-size="24" fill="#1F271B" text-anchor="start">MTL app/session adds or deletes its UDP port in udp4_dp_filter.</text>
<circle cx="70" cy="840" r="22" fill="#1F271B" stroke="#1F271B" stroke-width="3"/>
<text x="70.0" y="848.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="120.0" y="848.0" font-size="24" fill="#1F271B" text-anchor="start">The AF_XDP socket adds itself to xsks_map.</text>
<circle cx="70" cy="890" r="22" fill="#1F271B" stroke="#1F271B" stroke-width="3"/>
<text x="70.0" y="898.0" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="120.0" y="898.0" font-size="24" fill="#1F271B" text-anchor="start">The BPF prog sends packets of a listed UDP port to the socket.</text>
<path d="M60.0 962.0 L80.0 962.0 L80.0 946.0 L96.0 946.0 L70.0 918.0 L44.0 946.0 L60.0 946.0 Z" fill="#0B4F6C" stroke="#1F271B" stroke-width="3" stroke-linejoin="round"/>
<text x="120.0" y="948.0" font-size="24" fill="#1F271B" text-anchor="start">Other packets go to the kernel network stack.</text>
<path d="M1000.0 785.0 L1072.0 785.0" fill="none" stroke="#1F271B" stroke-width="4" stroke-linejoin="round"/>
<path d="M1090.0 785.0 L1070.0 796.0 L1070.0 774.0 Z" fill="#1F271B"/>
