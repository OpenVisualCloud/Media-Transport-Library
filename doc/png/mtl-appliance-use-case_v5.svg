<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="842" viewBox="0 0 1320 842" role="img" aria-labelledby="t d">
<title id="t">Synchronous playback through an Intel SDM appliance</title>
<desc id="d">The HDMI output of laptop A goes into the sending device, an Intel NUC with i225 Ethernet at IP 192.168.100.32/24, through an HDMI-to-USB video capture card. The NUC streams the desktop to multicast 239.168.85.20. A 2.5GbE link connects it to a 10GbE switch, and a 2.5GbE link connects the switch to the receiving device, an Intel SDM based PC with i225 Ethernet at IP 192.168.100.30/24.</desc>
