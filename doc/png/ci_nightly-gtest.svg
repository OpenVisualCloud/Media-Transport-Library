<path d="M390.0 162.0 L376.0 169.0 L376.0 155.0 Z" fill="#1F271B"/>
<path d="M690.0 162.0 L766.0 162.0" fill="none" stroke="#1F271B" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M780.0 162.0 L766.0 169.0 L766.0 155.0 Z" fill="#1F271B"/>
<rect x="390.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#CBB9A8"/>
<text x="540.0" y="149.0" font-size="17" font-weight="700" fill="#1F271B" text-anchor="middle">Build</text>
<text x="540.0" y="173.0" font-size="14" fill="#1F271B" text-anchor="middle">the Build workflow, as a called</text>
<text x="540.0" y="192.0" font-size="14" fill="#1F271B" text-anchor="middle">workflow</text>
<rect x="780.0" y="110.0" width="300.0" height="104.0" rx="8" fill="#145C9E"/>
<text x="930.0" y="149.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Run gtest</text>
<text x="930.0" y="173.0" font-size="14" fill="#ffffff" text-anchor="middle">bind ports, task ci:gtest-nightly,</text>
<text x="930.0" y="192.0" font-size="14" fill="#ffffff" text-anchor="middle">task ci:report -- status</text>
<rect x="996.4" y="97.0" width="73.6" height="26.0" rx="13" fill="#1F271B"/>
<text x="1033.2" y="115.0" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">x3 NIC</text>
<rect x="50.0" y="258.0" width="26.0" height="18.0" rx="4" fill="#145C9E"/>
<text x="84.0" y="272.0" font-size="14" fill="#1F271B" text-anchor="start">Self-hosted runner (NIC host)</text>
<rect x="316.4" y="258.0" width="26.0" height="18.0" rx="4" fill="#CBB9A8"/>
<text x="350.4" y="272.0" font-size="14" fill="#1F271B" text-anchor="start">Runs another workflow</text>
<text x="50.0" y="310.0" font-size="15" fill="#1F271B" text-anchor="start">When nightly-gtest and nightly-pytest are both done, Nightly Combined Report merges their results.</text>
