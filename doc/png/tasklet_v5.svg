<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="884" viewBox="0 0 1400 884" role="img" aria-labelledby="t d">
<title id="t">Tasklet based asynchronous architecture</title>
<desc id="d">Each tasklet registers with the scheduler. The scheduler runs the registered tasklets one after the other in a loop: session receivers, session transmitters, and the KNI, IGMP, PTP and ARP tasklets.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<rect width="1400" height="884" fill="#ffffff"/>
<text x="40.0" y="62.0" font-size="32" font-weight="700" fill="#1F271B" text-anchor="start">Tasklet based asynchronous architecture</text>
<rect x="40" y="110" width="172" height="100" rx="8" fill="#0B4F6C" stroke="#1F271B" stroke-width="3"/>
<text x="126.0" y="165.9" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Scheduler</text>
<rect x="212" y="110" width="278" height="100" rx="8" fill="#DCC7BE" stroke="#1F271B" stroke-width="3"/>
<text x="232.0" y="151.9" font-size="20" fill="#1F271B" text-anchor="start">Tasklet register</text>
<text x="232.0" y="177.9" font-size="20" fill="#1F271B" text-anchor="start">Tasklet execution</text>
<rect x="40" y="226" width="172" height="180" rx="8" fill="#0B4F6C" stroke="#1F271B" stroke-width="3"/>
<text x="126.0" y="321.9" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">Tasklets</text>
<rect x="212" y="226" width="278" height="180" rx="8" fill="#DCC7BE" stroke="#1F271B" stroke-width="3"/>
<text x="232.0" y="268.9" font-size="20" fill="#1F271B" text-anchor="start">TX video sessions,</text>
<text x="232.0" y="294.9" font-size="20" fill="#1F271B" text-anchor="start">audio sessions,</text>
<text x="232.0" y="320.9" font-size="20" fill="#1F271B" text-anchor="start">RX sessions,</text>
<text x="232.0" y="346.9" font-size="20" fill="#1F271B" text-anchor="start">NIC transmitters,</text>
<text x="232.0" y="372.9" font-size="20" fill="#1F271B" text-anchor="start">NIC receivers, etc.</text>
<rect x="40" y="442" width="450" height="90" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<text x="60.0" y="478.9" font-size="20" fill="#1F271B" text-anchor="start">Introduce an L-Core scheduler</text>
<text x="60.0" y="504.9" font-size="20" fill="#1F271B" text-anchor="start">abstraction to fully use the CPU.</text>
<rect x="40" y="546" width="450" height="120" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<text x="60.0" y="584.9" font-size="20" fill="#1F271B" text-anchor="start">Excellent data affinity: sessions and</text>
<text x="60.0" y="610.9" font-size="20" fill="#1F271B" text-anchor="start">TX/RX can live in the same</text>
<text x="60.0" y="636.9" font-size="20" fill="#1F271B" text-anchor="start">L-Core scheduler.</text>
<rect x="40" y="680" width="450" height="90" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<text x="60.0" y="716.9" font-size="20" fill="#1F271B" text-anchor="start">Predictable schedule time</text>
<text x="60.0" y="742.9" font-size="20" fill="#1F271B" text-anchor="start">for each tasklet.</text>
<rect x="40" y="784" width="450" height="60" rx="8" fill="#ffffff" stroke="#1F271B" stroke-width="3"/>
<text x="60.0" y="818.9" font-size="20" fill="#1F271B" text-anchor="start">Easy integration with accelerators.</text>
