<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1390" height="840" viewBox="0 0 1390 840" role="img" aria-labelledby="t d">
<title id="t">RX header split: the NIC writes each payload into its frame slot</title>
<desc id="d">The E810 NIC splits each received packet after the UDP header. It writes the Ethernet, IP and UDP headers into a header mbuf, and the RTP header, SRD headers and pixels into slot k of the frame buffer, which starts at the frame address plus k times the stride. The RX video tasklet reads the RTP header from the slot, checks the slot of the packet and copies no payload, then gives the slotted frame to the application. The tasklet frees the mbuf to the slot pool, and the pool refills the RX descriptor ring with the mbuf of the next slot, in frame order.</desc>
