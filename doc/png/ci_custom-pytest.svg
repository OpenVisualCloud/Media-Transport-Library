<title id="t">custom-pytest: any pytest selection on any NIC</title>
<desc id="d">By hand only. Pick the NIC host, a marker, a test filter and a directory; it calls Build and then runs exactly that selection.</desc>
<g font-family="'Intel Clear', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
