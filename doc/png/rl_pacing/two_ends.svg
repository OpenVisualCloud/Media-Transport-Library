<text x="435.9" y="309.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="middle">15</text>
<line x1="521.2" y1="290.0" x2="521.2" y2="295.0" stroke="#1f1f1f" stroke-width="1.2"/>
<text x="521.2" y="309.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="middle">20</text>
<line x1="606.5" y1="290.0" x2="606.5" y2="295.0" stroke="#1f1f1f" stroke-width="1.2"/>
