<text x="20.0" y="28.0" font-size="20" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="start" font-weight="bold">After a stalled call MTL knows the return, not the doorbell</text>
<text x="20.0" y="49.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#555555" text-anchor="start">1080p59.94. One pad burst returns 2.5 µs late. The NIC gets its pads at the doorbell, which rang at A, at B or in between.</text>
<text x="20.0" y="80.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="start" font-weight="bold">What MTL sees: one call</text>
