<rect width="960" height="485" fill="#ffffff"/>
<text x="20.0" y="32.0" font-size="20" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">The pre-arm: pads queued ahead of packet 0 let the NIC send it on time</text>
<text x="20.0" y="56.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">1080p59.94. Sessions s1 to s8 share one CPU core, which visits each in turn; this is session 1's frame start.</text>
<text x="20.0" y="75.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">Pads are padding packets that the NIC sends at the stream's rate. Visit durations are illustrative.</text>
<text x="20.0" y="111.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">Colour code:</text>
<rect x="124.0" y="100.0" width="16.0" height="14.0" rx="2" fill="#d6edd2" stroke="#3a9a2e" stroke-width="2"/>
<text x="146.0" y="111.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">session 1: its visit, its pads, its frame packets</text>
<rect x="462.0" y="100.0" width="16.0" height="14.0" rx="2" fill="#3a9a2e" stroke="#3a9a2e" stroke-width="2"/>
<text x="484.0" y="111.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">packet 0, the frame's first packet</text>
<rect x="719.0" y="100.0" width="16.0" height="14.0" rx="2" fill="#d3ddef" stroke="#2f5597" stroke-width="2"/>
<text x="741.0" y="111.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">visits of sessions s2 to s8</text>
<rect x="124.0" y="122.0" width="16.0" height="14.0" rx="2" fill="#e8e8e8" stroke="#8a8a8a" stroke-width="2"/>
<text x="146.0" y="133.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">other work on the core</text>
<text x="20.0" y="248.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">CPU core</text>
<text x="20.0" y="264.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">what it runs</text>
<text x="20.0" y="338.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">NIC, session 1</text>
<text x="20.0" y="354.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">what it sends</text>
<line x1="198.2" y1="228.0" x2="198.2" y2="360.0" stroke="#454545" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="198.2" y="206.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="middle">warm-up window opens</text>
<text x="198.2" y="221.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545" text-anchor="middle">0.5 ms before the target</text>
<line x1="654.0" y1="228.0" x2="654.0" y2="360.0" stroke="#1f1f1f" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="654.0" y="221.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="middle">packet 0's target</text>
