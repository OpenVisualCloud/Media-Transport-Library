<text x="20.0" y="692.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">The late sender's packet 0 was due 19.5 µs before TPR0. It arrives 29.5 µs later, at +10 µs, when the receiver</text>
<text x="20.0" y="710.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">has already wanted 3 packets: VRX = 1 − 3 = −2. Every packet behind it is as late, so VRX stays at −2.</text>
