<rect width="960" height="730" fill="#ffffff"/>
<text x="20.0" y="32.0" font-size="20" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">MTL keeps the receiver buffer (VRX) at 5; a late packet 0 takes it below 0</text>
<text x="20.0" y="56.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">A model of the ST 2110-21 virtual receiver at 1080p59.94: from TPR0, the time it starts to play the frame,</text>
<text x="20.0" y="75.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">it takes one packet out of its buffer every Trs = 3.89 µs. VRX = packets arrived − packets taken out.</text>
<text x="20.0" y="94.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">A sender must keep VRX between 0 and 9. Wire delay is left out.</text>
<text x="20.0" y="131.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">Colour code:</text>
<rect x="124.0" y="120.0" width="16.0" height="14.0" rx="2" fill="#d6edd2" stroke="#3a9a2e" stroke-width="2"/>
<text x="146.0" y="131.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">MTL: each packet sent 5 Trs (19.5 µs) before its turn</text>
<rect x="502.0" y="120.0" width="16.0" height="14.0" rx="2" fill="#f6d3d8" stroke="#b5122b" stroke-width="2" stroke-dasharray="4 2"/>
<text x="524.0" y="131.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">a sender 29.5 µs late</text>
<rect x="678.0" y="120.0" width="16.0" height="14.0" rx="2" fill="#e8e8e8" stroke="#8a8a8a" stroke-width="2"/>
<text x="700.0" y="131.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">the receiver</text>
