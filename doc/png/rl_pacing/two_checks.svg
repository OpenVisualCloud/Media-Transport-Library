<text x="30.0" y="708.0" font-size="12" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f1f1f">TX_VIDEO_SESSION(0): lead -3.0us, frames fall behind: move sessions off this scheduler</text>
<text x="20.0" y="742.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">Logged at most once per stats period for each scheduler, here scheduler 0, and when a session leaves it.</text>
<text x="20.0" y="760.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">A late packet here may or may not have taken VRX below 0; check 1 reports the frames where it may have.</text>
<text x="20.0" y="778.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">It also fires when the average round exceeds the round budget, but not on a sleeping scheduler.</text>
