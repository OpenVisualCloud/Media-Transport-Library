<text x="20.0" y="512.0" font-size="15" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">Check 2, per scheduler: was the next packet already due when the CPU came to build it?</text>
<text x="20.0" y="534.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">lead = the next packet's due time − now, at each visit of the session's packet builder</text>
