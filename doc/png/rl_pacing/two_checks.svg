<text x="695.0" y="316.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545" text-anchor="middle">+30</text>
<line x1="787.5" y1="296.0" x2="787.5" y2="301.0" stroke="#1f1f1f" stroke-width="1"/>
<text x="787.5" y="316.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545" text-anchor="middle">+35</text>
<line x1="880.0" y1="296.0" x2="880.0" y2="301.0" stroke="#1f1f1f" stroke-width="1"/>
<text x="880.0" y="316.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545" text-anchor="middle">+40</text>
<text x="880.0" y="334.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545" text-anchor="end">how late it left: its burst's return, for packet 0 also its pads' estimated end + aim (a lower bound): µs after its target</text>
<text x="20.0" y="188.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">VRX goes below 0 at 23.3 µs less the frame's 90 kHz snap (0 to 4 µs): from 19.3 µs on some frames, past 23.3 µs on all.</text>
<text x="20.0" y="205.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">The budget takes off the largest snap (4 µs) and the pad sawtooth (5.9 µs): 13.5 µs.</text>
<line x1="389.8" y1="252.0" x2="389.8" y2="238.0" stroke="#454545" stroke-width="1"/>
<text x="389.8" y="234.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="end">VRX budget 13.5 µs</text>
<line x1="572.0" y1="252.0" x2="572.0" y2="226.0" stroke="#454545" stroke-width="1"/>
<text x="572.0" y="222.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="end">VRX &lt; 0 past 23.3 µs, whatever the snap</text>
<circle cx="685.8" cy="271.0" r="7" fill="#b5122b" stroke="#ffffff" stroke-width="1.5"/>
<line x1="685.8" y1="263.0" x2="685.8" y2="238.0" stroke="#b5122b" stroke-width="1.2"/>
<text x="685.8" y="234.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="middle">example: packet 0 at +29.5 µs</text>
<rect x="20.0" y="346.0" width="920.0" height="48.0" rx="4" fill="#f6f6f6" stroke="#c8c8c8" stroke-width="1"/>
<text x="30.0" y="364.0" font-size="12" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f1f1f">TX_VIDEO_SESSION(0,3): 1 frames may break VRX &gt;= 0, a pkt up to 29.5us past its</text>
<text x="30.0" y="382.0" font-size="12" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" fill="#1f1f1f">target over the 13.5us budget: packet 0 1 mid-frame 0; 0 frames started up to 0.0us late</text>
<text x="20.0" y="416.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">Logged at most once per stats period (10 s default) per session. A frame counts once per port: twice if late on both ST 2022-7 legs.</text>
<text x="20.0" y="434.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">"packet 0 1 mid-frame 0": of the flagged frames, 1 was late at packet 0 and 0 at a later packet.</text>
<text x="20.0" y="452.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">"0 frames started up to 0.0us late": the builder started no frame more than the budget after packet 0's target.</text>
</g>
<!-- check 2, per scheduler: the builder's lead -->
