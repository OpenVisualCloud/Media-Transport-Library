<rect width="960" height="798" fill="#ffffff"/>
<text x="20.0" y="32.0" font-size="20" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">Two log checks: frames that may break VRX, and a scheduler that falls behind</text>
<text x="20.0" y="56.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">1080p59.94, with illustrative values. VRX is the ST 2110-21 receiver's buffer level, which must stay ≥ 0;</text>
<text x="20.0" y="75.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545">a packet's target is the time MTL schedules it to leave.</text>
<text x="20.0" y="111.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">Colour code:</text>
<rect x="124.0" y="100.0" width="16.0" height="14.0" rx="2" fill="#d6edd2" stroke="#3a9a2e" stroke-width="2"/>
<text x="146.0" y="111.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">in time: not reported</text>
<rect x="298.0" y="100.0" width="16.0" height="14.0" rx="2" fill="url(#hatchR)" stroke="#b5122b" stroke-width="2" stroke-dasharray="4 2"/>
<text x="320.0" y="111.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">reported, VRX can still be ≥ 0</text>
<rect x="583.0" y="100.0" width="16.0" height="14.0" rx="2" fill="#f6d3d8" stroke="#b5122b" stroke-width="2"/>
<text x="605.0" y="111.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">reported, VRX &lt; 0</text>
<!-- check 1, per session: lateness of a packet against the VRX budget -->
<g id="check-1">
<text x="20.0" y="164.0" font-size="15" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" font-weight="bold">Check 1, per session, counted per port: did a packet leave later than its VRX budget allows?</text>
<rect x="140.0" y="256.0" width="249.8" height="30.0" rx="0" fill="#d6edd2" stroke="#3a9a2e" stroke-width="1.2"/>
<text x="264.9" y="276.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="middle">within the budget</text>
<rect x="389.8" y="256.0" width="182.3" height="30.0" rx="0" fill="url(#hatchR)" stroke="#b5122b" stroke-width="1.2" stroke-dasharray="4 2"/>
<rect x="572.0" y="256.0" width="308.0" height="30.0" rx="0" fill="#f6d3d8" stroke="#b5122b" stroke-width="1.5"/>
<text x="580.0" y="276.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f">VRX &lt; 0</text>
<rect x="414.4" y="265.8" width="133.0" height="14.4" rx="3" fill="#ffffff"/>
<text x="480.9" y="276.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="middle">VRX can still be ≥ 0</text>
<line x1="140.0" y1="296.0" x2="880.0" y2="296.0" stroke="#1f1f1f" stroke-width="1.2"/>
<line x1="140.0" y1="296.0" x2="140.0" y2="301.0" stroke="#1f1f1f" stroke-width="1"/>
<text x="140.0" y="316.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545" text-anchor="middle">its target</text>
<line x1="232.5" y1="296.0" x2="232.5" y2="301.0" stroke="#1f1f1f" stroke-width="1"/>
<text x="232.5" y="316.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#454545" text-anchor="middle">+5</text>
