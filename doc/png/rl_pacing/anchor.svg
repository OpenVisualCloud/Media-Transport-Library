<line x1="200.4" y1="208.0" x2="200.4" y2="270.0" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
<text x="20.0" y="316.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="start" font-weight="bold">A tick in the burst behind the anchor is no stall: the shaper is still sending the anchor's pads</text>
<text x="170.0" y="341.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#555555" text-anchor="end">CPU</text>
