<rect width="960" height="446" fill="#ffffff"/>
<text x="20.0" y="28.0" font-size="20" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="start" font-weight="bold">The anchor: a short first burst is quick to drain</text>
<text x="20.0" y="49.0" font-size="13" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#555555" text-anchor="start">1080p59.94, a 10 µs timer tick in a pad burst. An idle shaper has a full bucket: it sends its first 7 µs of pads at once.</text>
<text x="20.0" y="84.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="start" font-weight="bold">A first burst of 32 pads is a stall: the pre-arm can start over 125 µs after the return</text>
<text x="170.0" y="109.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#555555" text-anchor="end">CPU</text>
<text x="170.0" y="139.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#555555" text-anchor="end">NIC queue</text>
<line x1="200.4" y1="92.0" x2="200.4" y2="154.0" stroke="#555555" stroke-width="1" stroke-dasharray="3 3"/>
<text x="20.0" y="200.0" font-size="14" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#1f1f1f" text-anchor="start" font-weight="bold">The anchor, 5 pads, is a stall: the pre-arm can start over after 20 µs</text>
<text x="170.0" y="225.0" font-size="12" font-family="DejaVu Sans, Verdana, Geneva, sans-serif" fill="#555555" text-anchor="end">CPU</text>
