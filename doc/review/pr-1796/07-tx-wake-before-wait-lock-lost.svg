<text x='34' y='355' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#b42318' font-weight='normal' text-anchor='start'>Result: The get sleeps the full block timeout, so &quot;stop; wake_block(); join()&quot; stalls.</text>
