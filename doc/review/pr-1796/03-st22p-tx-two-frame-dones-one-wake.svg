<text x='34' y='495' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#b42318' font-weight='normal' text-anchor='start'>Result: Getter B sleeps the full block timeout while frame 1 is FREE. The claim is gated on the flag, so a</text>
