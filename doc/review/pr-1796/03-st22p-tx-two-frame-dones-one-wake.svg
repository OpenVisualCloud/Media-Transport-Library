<text x='34' y='549' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#067647' font-weight='normal' text-anchor='start'>Upstream / fix: Fix: try the claim on every wake, not only when the flag is set.</text>
<rect x='24' y='568' width='900' height='46' rx='6' fill='#f9fafb' stroke='#344054'/>
<text x='34' y='587' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#344054' font-weight='normal' text-anchor='start'>How the test forces it: Two getter threads block, then the test calls frame_done(0) and frame_done(1) back</text>
