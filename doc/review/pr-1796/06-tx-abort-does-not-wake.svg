<text x='40' y='154' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#101828' font-weight='normal' text-anchor='start'>1. get_frame(): holds the only slot (IN_USER)</text>
<rect x='482' y='174' width='434' height='28' rx='4' fill='white' stroke='#667085'/>
<text x='490' y='192' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#101828' font-weight='normal' text-anchor='start'>2. get_frame(): no FREE slot -&gt; cond_timedwait(2 s)</text>
<rect x='32' y='212' width='434' height='44' rx='4' fill='white' stroke='#667085'/>
<text x='40' y='230' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#101828' font-weight='normal' text-anchor='start'>3. put_frame_abort() (or put_frame() with a too-large</text>
<text x='40' y='246' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#101828' font-weight='normal' text-anchor='start'>user_meta): slot = FREE; no notify_frame_available()</text>
<rect x='482' y='266' width='434' height='44' rx='4' fill='white' stroke='#667085'/>
<text x='490' y='284' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#101828' font-weight='normal' text-anchor='start'>4. nobody signals; at ETIMEDOUT the loop breaks</text>
<text x='490' y='300' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#101828' font-weight='normal' text-anchor='start'>without a last claim</text>
<rect x='24' y='320' width='900' height='30' rx='6' fill='#fef3f2' stroke='#b42318'/>
<text x='34' y='339' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#b42318' font-weight='normal' text-anchor='start'>Result: The getter returns NULL after 2 s, while a FREE slot waited the whole time.</text>
<rect x='24' y='358' width='900' height='30' rx='6' fill='#ecfdf3' stroke='#067647'/>
<text x='34' y='377' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#067647' font-weight='normal' text-anchor='start'>Upstream / fix: Fix: call tx_st*p_notify_frame_available(ctx) after each of the four FREE stores.</text>
<rect x='24' y='396' width='900' height='30' rx='6' fill='#f9fafb' stroke='#344054'/>
<text x='34' y='415' font-family='DejaVu Sans Mono, Menlo, Consolas, monospace' font-size='12' fill='#344054' font-weight='normal' text-anchor='start'>How the test forces it: One slot; the abort runs 80 ms after the getter blocks. Deterministic.</text>
